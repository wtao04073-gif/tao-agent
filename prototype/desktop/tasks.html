<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心 · 办公 Agent 平台原型</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<div class="app">
  <div data-sidenav="tasks"></div>

  <div class="main">
    <header class="topbar">
      <h1>任务中心</h1>
      <span class="topbar__sub">Spec 4.4 · 任务与会话分离后的统一管理</span>
      <span class="topbar__spacer"></span>
      <input type="search" id="kw" placeholder="搜索任务标题或任务号" style="width:220px" aria-label="搜索任务">
      <button class="iconbtn" data-theme-toggle type="button">☾</button>
    </header>

    <main class="page" id="main">

      <!-- 并发占用提示（含升档引导） -->
      <div class="section" id="concurrency"></div>

      <!-- 筛选器：状态 / 场景 / 排序 -->
      <section class="section">
        <div class="card">
          <div class="card__body" style="display:flex;gap:var(--sp-4);flex-wrap:wrap;align-items:center">
            <div>
              <div class="field__label" style="margin-bottom:6px">按状态筛选</div>
              <div class="segmented" role="group" aria-label="按状态筛选任务" id="statusFilter">
                <button type="button" data-st="all" aria-pressed="true">全部</button>
                <button type="button" data-st="running" aria-pressed="false">执行中</button>
                <button type="button" data-st="queued" aria-pressed="false">排队中</button>
                <button type="button" data-st="waiting" aria-pressed="false">等待确认</button>
                <button type="button" data-st="done" aria-pressed="false">已完成</button>
                <button type="button" data-st="failed" aria-pressed="false">失败</button>
                <button type="button" data-st="cancelled" aria-pressed="false">已取消</button>
              </div>
            </div>
            <div style="min-width:180px">
              <label class="field__label" for="sceneFilter" style="margin-bottom:6px">按场景筛选</label>
              <select id="sceneFilter"><option value="all">全部场景</option></select>
            </div>
            <div style="min-width:150px">
              <label class="field__label" for="sortBy" style="margin-bottom:6px">排序</label>
              <select id="sortBy">
                <option value="updated">最近更新优先</option>
                <option value="created">创建时间倒序</option>
                <option value="status">按状态分组</option>
              </select>
            </div>
            <span style="flex:1"></span>
            <div>
              <div class="field__label" style="margin-bottom:6px">批量操作</div>
              <div class="btn-row">
                <button class="btn btn--sm" type="button" id="bulkRetry" disabled>重试所选</button>
                <button class="btn btn--sm btn--danger" type="button" id="bulkCancel" disabled>取消所选</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 任务列表 -->
      <section class="section">
        <div class="section__head">
          <h2>任务列表</h2>
          <span class="section__desc" id="countHint"></span>
        </div>
        <div id="listHost"></div>
      </section>

      <p class="hint">
        额度以<strong>产物与任务</strong>为单位呈现，不以会话次数计。
        <button class="btn btn--sm btn--ghost" data-reset-demo type="button">重置演示数据</button>
      </p>
    </main>
  </div>
</div>

<!-- ===== 任务详情（执行日志 / 产物 / 消耗） ===== -->
<div class="modal-backdrop" id="detailModal" aria-hidden="true">
  <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="dtTitle">
    <div class="modal__head">
      <div>
        <h2 id="dtTitle">任务详情</h2>
        <p id="dtMeta"></p>
      </div>
      <span class="spacer"></span>
      <button class="iconbtn" type="button" data-modal-close="detailModal" aria-label="关闭">×</button>
    </div>
    <div class="modal__body">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true"  data-tab="log">执行日志</button>
        <button role="tab" aria-selected="false" data-tab="out">产物</button>
        <button role="tab" aria-selected="false" data-tab="use">消耗</button>
      </div>
      <div id="dtBody"></div>
    </div>
    <div class="modal__foot">
      <span class="hint" id="dtFootHint"></span>
      <span class="spacer"></span>
      <a class="btn" id="dtGoSession" href="#">跳回来源会话</a>
      <button class="btn" type="button" data-modal-close="detailModal">关闭</button>
    </div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
/* =========================================================================
   任务中心（Spec 4.4）
   - 状态 / 场景筛选与排序真实过滤列表
   - 取消 / 重试真实改变行状态并回写 Store（与会话页、移动端共享）
   - 失败原因归类展示；空态；并发上限提示与升档引导
   ========================================================================= */
(function () {
  var U = App.Util, Store = App.Store, S = App.Scenes, Lease = App.Lease;
  var f = { st: 'all', scene: 'all', sort: 'updated', kw: '' };
  var selected = {};

  /* 场景筛选下拉：只列出实际出现过的场景 */
  (function fillScenes() {
    var used = {}, opts = [];
    Store.tasks().forEach(function (t) {
      if (!used[t.scene]) { used[t.scene] = true; opts.push(t.scene); }
    });
    var sel = U.$('#sceneFilter');
    opts.forEach(function (id) {
      var s = S.get(id);
      var o = document.createElement('option');
      o.value = id;
      o.textContent = s ? s.title : id;
      sel.appendChild(o);
    });
  })();

  /* 失败原因归类（Spec 4.4 状态与反馈） */
  function failCategory(reason) {
    if (!reason) return '未分类';
    if (/合并单元格|表头|解析/.test(reason)) return '数据源格式问题';
    if (/超时|时长|步数/.test(reason)) return '执行超限';
    if (/权限|无权|拒绝/.test(reason)) return '权限不足';
    if (/额度|配额|熔断/.test(reason)) return '额度不足';
    return '其他';
  }

  function filtered() {
    var list = Store.tasks().slice();
    if (f.st !== 'all')    list = list.filter(function (t) { return t.status === f.st; });
    if (f.scene !== 'all') list = list.filter(function (t) { return t.scene === f.scene; });
    if (f.kw) {
      var k = f.kw.toLowerCase();
      list = list.filter(function (t) {
        return (t.title + ' ' + t.id).toLowerCase().indexOf(k) >= 0;
      });
    }
    var ORDER = ['running', 'waiting', 'queued', 'failed', 'done', 'cancelled'];
    if (f.sort === 'created') list.sort(function (a, b) { return b.created - a.created; });
    else if (f.sort === 'status') list.sort(function (a, b) {
      return ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || b.updated - a.updated;
    });
    else list.sort(function (a, b) { return b.updated - a.updated; });
    return list;
  }

  function render() {
    var list = filtered();
    var host = U.$('#listHost');
    U.$('#countHint').textContent = '共 ' + list.length + ' 个任务' +
      (f.st === 'all' ? '' : '（已按「' + (App.STATUS[f.st] || {}).label + '」筛选）');

    /* --- 空态（区分「完全没有任务」与「筛选后无结果」） --- */
    if (!list.length) {
      var none = Store.tasks().length === 0;
      host.innerHTML = '<div class="card"><div class="empty">' +
        '<div class="empty__icon" aria-hidden="true">' + (none ? '📭' : '🔎') + '</div>' +
        '<h3>' + (none ? '还没有任何任务' : '当前筛选条件下没有任务') + '</h3>' +
        '<p>' + (none
          ? '任务从场景工作台发起。选一张场景卡、按引导填写要点，提交后任务会异步执行，进度会在这里汇总。'
          : '试试切换状态筛选，或清空搜索关键词。') + '</p>' +
        '<div class="btn-row" style="justify-content:center">' +
        (none ? '<a class="btn btn--primary" href="workbench.html">去场景工作台</a>'
              : '<button class="btn" type="button" id="clearFilter">清除全部筛选</button>') +
        '</div></div></div>';
      var cf = U.$('#clearFilter');
      if (cf) cf.addEventListener('click', function () {
        f = { st: 'all', scene: 'all', sort: f.sort, kw: '' };
        U.$('#kw').value = '';
        U.$('#sceneFilter').value = 'all';
        U.$$('#statusFilter button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-st') === 'all'));
        });
        render();
      });
      return;
    }

    host.innerHTML = '<div class="table-wrap"><table class="data">' +
      '<thead><tr>' +
        '<th style="width:32px"><span class="sr-only">选择</span></th>' +
        '<th>任务</th><th style="width:108px">状态</th><th style="width:210px">进度与当前动作</th>' +
        '<th style="width:96px">创建人</th><th style="width:92px">更新</th>' +
        '<th style="width:60px" class="num">产物</th><th style="width:200px">操作</th>' +
      '</tr></thead><tbody>' +
      list.map(row).join('') + '</tbody></table></div>';
    paintBulk();
  }

  function row(t) {
    var s = S.get(t.scene);
    var ind = S.industryMeta(t.industry);
    var pct = Math.round(t.step / (t.stepTotal || 1) * 100);
    var progCls = t.status === 'failed' ? ' progress--err'
      : t.status === 'done' ? ' progress--ok'
      : t.status === 'waiting' ? ' progress--warn' : '';

    var acts = '<a class="btn btn--sm" href="session.html?task=' + encodeURIComponent(t.id) + '">会话</a>' +
      '<button class="btn btn--sm" type="button" data-detail="' + t.id + '">详情</button>';
    if (t.status === 'running' || t.status === 'queued' || t.status === 'waiting') {
      acts += '<button class="btn btn--sm btn--danger" type="button" data-cancel="' + t.id + '">取消</button>';
    }
    if (t.status === 'failed' || t.status === 'cancelled') {
      acts += '<button class="btn btn--sm btn--primary" type="button" data-retry="' + t.id + '">重试</button>';
    }

    var selectable = t.status !== 'done';
    return '<tr data-row="' + t.id + '">' +
      '<td>' + (selectable
        ? '<input type="checkbox" data-sel="' + t.id + '"' + (selected[t.id] ? ' checked' : '') +
          ' aria-label="选择任务 ' + U.esc(t.title) + '">'
        : '') + '</td>' +
      '<td><div class="cell-main">' + U.esc(t.title) + '</div>' +
        '<div class="cell-sub"><span class="mono">' + U.esc(t.id) + '</span> · ' +
        '<span class="ind ' + ind.cls + '">' + ind.label + '</span> ' +
        U.esc(s ? s.title : '自由对话') + '</div></td>' +
      '<td>' + App.statusTag(t.status) +
        (t.status === 'failed'
          ? '<div class="cell-sub" style="margin-top:4px"><span class="tag tag--err">' +
            failCategory(t.reason) + '</span></div>' : '') + '</td>' +
      '<td><div class="progress' + progCls + '" style="margin-bottom:5px" role="progressbar" ' +
        'aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '">' +
        '<div class="progress__fill" style="width:' + pct + '%"></div></div>' +
        '<div class="cell-sub">' + t.step + '/' + t.stepTotal + ' 步 · ' + U.esc(t.now) + '</div></td>' +
      '<td><div class="cell-sub">' + U.esc(t.owner) + '<br>' + U.esc(t.workspace) + '</div></td>' +
      '<td><div class="cell-sub">' + U.ago(t.updated) + '</div></td>' +
      '<td class="num">' + ((t.artifacts || []).length || '—') + '</td>' +
      '<td><div class="btn-row">' + acts + '</div></td>' +
      '</tr>';
  }

  /* ---------------- 并发占用提示 + 升档引导 ---------------- */
  function renderConcurrency() {
    var running = Store.tasks().filter(function (t) { return t.status === 'running'; }).length;
    var queued  = Store.tasks().filter(function (t) { return t.status === 'queued'; }).length;
    var LIMIT = 2;
    var host = U.$('#concurrency');
    if (running >= LIMIT) {
      host.innerHTML = '<div class="banner banner--warn"><span aria-hidden="true">⚠</span>' +
        '<div class="spacer"><strong>并发已达上限（' + running + '/' + LIMIT + '）</strong><br>' +
        '当前为「基础档」，同时执行上限 2 个任务；已有 ' + queued + ' 个任务排队等待。' +
        '升级到「专业档」可放开至 8 个并发。</div>' +
        '<a class="btn btn--sm btn--primary" href="admin.html#quota">查看升档方案</a></div>';
    } else {
      host.innerHTML = '<div class="banner"><span aria-hidden="true">⚡</span>' +
        '<span class="spacer">并发占用 ' + running + '/' + LIMIT + '（基础档）' +
        (queued ? ' · ' + queued + ' 个排队中' : '') + '</span>' +
        '<a href="admin.html#quota" style="font-size:var(--fs-12)">配额与用量</a></div>';
    }
  }

  /* ---------------- 行内操作：取消 / 重试 / 详情 ---------------- */
  U.$('#listHost').addEventListener('click', function (e) {
    var c = e.target.closest('[data-cancel]');
    if (c) { doCancel(c.getAttribute('data-cancel')); return; }
    var r = e.target.closest('[data-retry]');
    if (r) { doRetry(r.getAttribute('data-retry')); return; }
    var d = e.target.closest('[data-detail]');
    if (d) { openDetail(d.getAttribute('data-detail')); return; }
  });
  U.$('#listHost').addEventListener('change', function (e) {
    var cb = e.target.closest('[data-sel]');
    if (!cb) return;
    var id = cb.getAttribute('data-sel');
    if (cb.checked) selected[id] = true; else delete selected[id];
    paintBulk();
  });

  function doCancel(id) {
    var t = Store.task(id);
    if (!t) return;
    adoptStop(id);
    // 取消由创建人发起，不受租约归属限制：revoke 在同一笔提交里递增租约版本，
    // 正在代跑它的页面下一拍校验必然失败，不会把终态又覆盖回执行中
    Lease.revoke(id, { status: 'cancelled', now: '已由 刘敏 取消（中间物保留）' }, function () {
      Store.refresh();
      App.Toast.show('任务已取消', t.title + ' · 已产出的中间物保留', 'info');
      delete selected[id];
      refresh();
      scheduleQueued();              // 取消释放名额，队首任务随即由本页接管
    });
  }
  function doRetry(id) {
    var t = Store.rawTask(id);
    if (!t) return;
    if (claiming[id]) return;      // 该任务已有在途的申领 / 接管提交，不重复发起
    // 从检查点续跑：保留已完成步骤，不重复消耗
    var from = Math.max(0, Math.min(typeof t.failedStep === 'number' ? t.failedStep : t.step,
      (t.stepTotal || 1) - 1));
    var note = '从检查点第 ' + from + ' 步续跑（已完成步骤不重复消耗）';
    // 重试等于重新入场，必须走并发名额：名额已满时退回排队，不直接置为 running，
    // 否则重试会成为绕过上限的第二条路径，也会留下无人推进的 running 任务
    var patch = { reason: '', retried: true, step: from, now: note };
    claiming[id] = true;
    // 来源状态限定为失败 / 已取消这两种：任务中心的重试入口本就只对这两类开放，
    // 而把允许范围写进申领本身，等锁期间任务被别处推进或改成别的状态时就不会被
    // 这笔旧请求改回 running
    Lease.claimSlot(id, patch, ['failed', 'cancelled'], function (got) {
      delete claiming[id];
      if (got) {
        Store.refresh();
        App.Toast.show('已重试', '从检查点第 ' + from + ' 步接力，前序步骤不重复消耗模型调用', 'ok');
        adoptRun(id, true);          // 取得名额即由本页推进，状态迁移与执行不分离
        delete selected[id];
        refresh();
        return;
      }
      // claimSlot 交回 null 不等于「名额已满」，三种原因的处置完全不同，先分辨再动作：
      //   1. 任务已不在 CLAIMABLE（典型是另一个标签页抢先把它重试成 running）——
      //      名额与租约都在对方手里，本页只刷新视图
      //   2. 租约仍由别的页面有效持有——同样交给持有方，本页不碰
      //   3. 以上都不是，才是名额真的满了，退回排队
      // 前两种若照「退回排队」处理，会清掉新持有者的租约、递增版本并把状态改回
      // queued，对方刚起来的推进循环下一拍就被强制中止
      var cur = Store.rawTask(id);
      if (!cur || Lease.CLAIMABLE.indexOf(cur.status) < 0 || Lease.heldByOther(cur)) {
        Store.refresh();
        App.Toast.show('重试已由其它页面接力', t.title + ' · 由持有执行租约的一方继续推进', 'info');
        delete selected[id];
        refresh();
        return;
      }
      // 名额已满：退回排队，由名额释放后的接管流程提升它。退回带上读到的状态、
      // 租约归属与租约版本做条件提交——若在这个间隙里别的页面把它抢成 running，
      // 期望值不符，这笔提交一个字段都不落，不会覆盖对方的租约与进度
      patch.status = 'queued';
      patch.now = '排队中：等待前序任务释放并发名额后从检查点第 ' + from + ' 步续跑';
      patch.leaseBy = '';
      patch.leaseAt = 0;
      patch.leaseVer = (cur.leaseVer || 0) + 1;
      Store.casCommit(id, {
        status: cur.status,
        leaseBy: cur.leaseBy,
        leaseVer: Lease.verIs(cur.leaseVer || 0)
      }, patch, function (wrote) {
        Store.refresh();
        if (wrote) {
          App.Toast.show('已排队重试', '当前并发已满，名额释放后将从检查点第 ' + from + ' 步接力',
            'info');
        }
        delete selected[id];
        refresh();
      });
    });
  }

  /* ---------------- 批量操作 ---------------- */
  function paintBulk() {
    var ids = Object.keys(selected);
    var canRetry = ids.filter(function (id) {
      var t = Store.task(id);
      return t && (t.status === 'failed' || t.status === 'cancelled');
    });
    var canCancel = ids.filter(function (id) {
      var t = Store.task(id);
      return t && (t.status === 'running' || t.status === 'queued' || t.status === 'waiting');
    });
    var rb = U.$('#bulkRetry'), cb = U.$('#bulkCancel');
    rb.disabled = canRetry.length === 0;
    cb.disabled = canCancel.length === 0;
    rb.textContent = '重试所选' + (canRetry.length ? '（' + canRetry.length + '）' : '');
    cb.textContent = '取消所选' + (canCancel.length ? '（' + canCancel.length + '）' : '');
  }
  U.$('#bulkRetry').addEventListener('click', function () {
    Object.keys(selected).forEach(function (id) {
      var t = Store.task(id);
      if (t && (t.status === 'failed' || t.status === 'cancelled')) doRetry(id);
    });
  });
  U.$('#bulkCancel').addEventListener('click', function () {
    Object.keys(selected).forEach(function (id) {
      var t = Store.task(id);
      if (t && (t.status === 'running' || t.status === 'queued' || t.status === 'waiting')) doCancel(id);
    });
  });

  /* ---------------- 任务详情 ---------------- */
  var dtTask = null, dtTab = 'log';
  function openDetail(id) {
    dtTask = Store.task(id);
    if (!dtTask) return;
    var s = S.get(dtTask.scene);
    U.$('#dtTitle').textContent = dtTask.title;
    U.$('#dtMeta').textContent = dtTask.id + ' · ' + (s ? s.title : '自由对话') +
      ' · ' + dtTask.owner + '（' + dtTask.workspace + '）';
    U.$('#dtGoSession').href = 'session.html?task=' + encodeURIComponent(dtTask.id);
    U.$('#dtFootHint').textContent = dtTask.status === 'failed'
      ? '失败原因归类：' + failCategory(dtTask.reason) : '';
    dtTab = 'log';
    U.$$('#detailModal [data-tab]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === 'log'));
    });
    paintDetail();
    App.Modal.open('detailModal');
  }

  function paintDetail() {
    var t = dtTask, host = U.$('#dtBody');
    if (!t) return;
    if (dtTab === 'log') {
      var logs = [];
      var base = t.created;
      for (var i = 0; i < t.step; i++) {
        logs.push([base + i * 62000, 'INFO', '第 ' + (i + 1) + ' 步完成']);
      }
      if (t.status === 'running') logs.push([t.updated, 'INFO', t.now]);
      if (t.status === 'waiting') logs.push([t.updated, 'WARN', t.now]);
      if (t.status === 'failed')  logs.push([t.updated, 'ERROR', t.reason || '未知错误']);
      if (t.status === 'done')    logs.push([t.updated, 'INFO', '交付物已生成并通过 Office/WPS 打开校验']);
      if (t.status === 'cancelled') logs.push([t.updated, 'WARN', t.now]);
      logs.unshift([base, 'INFO', '任务已创建，租户上下文与权限过滤已注入']);

      host.innerHTML = '<div class="table-wrap" style="max-height:44vh;overflow:auto">' +
        '<table class="data"><thead><tr><th style="width:92px">时间</th>' +
        '<th style="width:74px">级别</th><th>事件</th></tr></thead><tbody>' +
        logs.map(function (l) {
          var cls = l[1] === 'ERROR' ? 'tag--err' : l[1] === 'WARN' ? 'tag--warn' : '';
          return '<tr><td class="mono cell-sub">' + U.clock(l[0]) + '</td>' +
            '<td><span class="tag ' + cls + '">' + l[1] + '</span></td>' +
            '<td>' + U.esc(l[2]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (t.status === 'failed'
          ? '<div class="banner banner--err" style="margin-top:var(--sp-4)"><span aria-hidden="true">⚠</span>' +
            '<div><strong>失败原因（' + failCategory(t.reason) + '）</strong><br>' + U.esc(t.reason) +
            '</div></div>' : '') +
        '<p class="hint" style="margin-top:var(--sp-3)">执行节点异常重启后从检查点接力，' +
        '已完成步骤不重复消耗模型调用。</p>';
    } else if (dtTab === 'out') {
      var arts = t.artifacts || [];
      host.innerHTML = arts.length
        ? arts.map(function (a) {
            return '<div class="artifact" style="margin-bottom:var(--sp-2)">' + U.fileIcon(a.name) +
              '<div class="artifact__info"><div class="artifact__name">' + U.esc(a.name) + '</div>' +
              '<div class="artifact__meta">' + U.esc(a.size) + ' · ' +
              (a.state === 'ready' ? '已就绪，可下载编辑'
                : a.state === 'partial' ? '中间产物（任务未完成，已保留）' : '草稿，待确认后定稿') +
              '</div></div>' +
              '<div class="artifact__acts">' +
              '<a class="btn btn--sm" href="session.html?task=' + encodeURIComponent(t.id) + '">在会话中查看</a>' +
              '</div></div>';
          }).join('')
        : '<div class="empty" style="padding:var(--sp-8)">' +
          '<div class="empty__icon" aria-hidden="true">📄</div><h3>暂无产物</h3>' +
          '<p>任务尚未产出文件。执行到生成阶段后，交付物会出现在这里。</p></div>';
    } else {
      host.innerHTML =
        '<dl style="margin:0">' +
        '<div class="kv"><dt>模型 tokens</dt><dd>' + t.tokens.toLocaleString() + '</dd></div>' +
        '<div class="kv"><dt>折算成本</dt><dd>￥' + t.cost.toFixed(2) + '</dd></div>' +
        '<div class="kv"><dt>沙箱执行时长</dt><dd>' + (t.step * 24) + ' 秒</dd></div>' +
        '<div class="kv"><dt>检索请求</dt><dd>' + (t.step * 3) + ' 次</dd></div>' +
        '<div class="kv"><dt>额度计量单位</dt><dd>1 个任务 + ' + ((t.artifacts || []).length) + ' 份产物</dd></div>' +
        '<div class="kv"><dt>上下文缓存命中</dt><dd>71%</dd></div>' +
        '</dl>' +
        '<p class="hint" style="margin-top:var(--sp-4)">' +
        '计量埋点在 SaaS 与私有化两种形态下完全一致；私有化形态只上报不扣费，' +
        '配额转为并发与速率硬限制。</p>';
    }
  }
  U.$$('#detailModal [data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      U.$$('#detailModal [data-tab]').forEach(function (x) { x.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      dtTab = b.getAttribute('data-tab');
      paintDetail();
    });
  });

  /* ---------------- 筛选器绑定 ---------------- */
  U.$$('#statusFilter button').forEach(function (b) {
    b.addEventListener('click', function () {
      U.$$('#statusFilter button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      f.st = b.getAttribute('data-st');
      render();
    });
  });
  U.$('#sceneFilter').addEventListener('change', function (e) { f.scene = e.target.value; render(); });
  U.$('#sortBy').addEventListener('change', function (e) { f.sort = e.target.value; render(); });
  U.$('#kw').addEventListener('input', function (e) { f.kw = e.target.value.trim(); render(); });

  function refresh() {
    render();
    renderConcurrency();
    App.paintNavBadges();
  }
  refresh();

  /* ---------------- 排队接管：名额释放即提升队首任务 ----------------
     排队不依赖目标任务自己的会话页：任务中心是长驻页面，名额一空出就在这里
     完成队首任务的出队。名额申领、queued→running 迁移与取得执行租约是同一笔
     提交，整段在跨上下文互斥区内完成（App.Lease.claimSlot，见 app.js 的 Lock
     说明），不会与会话页同时抢到同一个名额。本页还负责把「租约已过期的运行中
     任务」捡回来继续推进，否则原推进页面一关，任务就永久卡在 running 无人接手。
     互斥依赖异步的 Web Locks，因此这里所有租约写入都以回调收结果。 */
  var LIMIT = Lease.LIMIT;
  var POLL_MS = 2000;
  var HEARTBEAT_MS = 3000;             // 心跳节奏须明显小于 Lease.TTL
  var tabId = Lease.id();

  function rawTasks() {
    var raw = Store.readRaw();
    return (raw && raw.tasks) ? raw.tasks : Store.tasks();
  }
  function runningCount() {
    return rawTasks().filter(function (t) { return t.status === 'running'; }).length;
  }

  var adopted = {};                    // 本页接管推进的任务 id → 定时器
  var beats = {};                      // 本页接管推进的任务 id → 心跳定时器
  var claiming = {};                   // 已发出申领 / 接管提交、结果未回的任务 id
  var advancing = {};                  // 已发出步骤推进提交、结果未回的任务 id（按任务隔离）

  function scheduleQueued() {
    adoptStale();
    // 名额够不够最终由 claimSlot 在互斥区内按当次快照判定，这里只是省一次取锁的粗筛
    if (runningCount() >= LIMIT) return;
    var next = rawTasks().filter(function (t) { return t.status === 'queued'; })
      .sort(function (a, b) { return a.created - b.created; })[0];
    if (!next || adopted[next.id] || claiming[next.id]) return;
    claiming[next.id] = true;
    Lease.claimSlot(next.id, { now: '并发名额已释放，由任务中心接管并开始执行' }, 'queued',
      function (ok) {
        delete claiming[next.id];
        if (!ok) return;
        Store.refresh();
        adoptRun(next.id, true);
      });
  }

  /** 捡回租约已过期的运行中任务：原推进页面已离开，由本页接手跑完 */
  function adoptStale() {
    Lease.staleRunning().forEach(function (st) {
      if (adopted[st.id] || claiming[st.id]) return;
      claiming[st.id] = true;
      Lease.adopt(st.id, { now: '执行中：租约已过期，由任务中心接管继续推进' }, function (ok) {
        delete claiming[st.id];
        if (!ok) return;
        Store.refresh();
        adoptRun(st.id, false);
      });
    });
  }

  /** 接管后紧接着把步骤跑起来，状态迁移与执行推进不分离 */
  function adoptRun(id, fresh) {
    var t = Store.task(id);
    if (!t) return;
    App.Toast.show(fresh ? '队首任务已出队' : '任务已被接管',
      t.title + (fresh ? ' · 名额释放后已自动开始执行' : ' · 原推进页面已离开，任务中心继续推进'),
      'ok', 5000);
    // 心跳续期：本页推进期间租约不会被误判过期而被别处抢走
    beats[id] = setInterval(function () {
      Lease.renew(id, {}, function (kept) { if (!kept) adoptStop(id); });
    }, HEARTBEAT_MS);
    adopted[id] = setInterval(function () { adoptTick(id); }, 3200);
    adoptTick(id);
  }
  function adoptStop(id) {
    if (adopted[id]) { clearInterval(adopted[id]); delete adopted[id]; }
    if (beats[id]) { clearInterval(beats[id]); delete beats[id]; }
  }

  /** 高危动作是否仍需人工确认：口径在 tick 外层与互斥区内的 patch 里共用一份 */
  function needsDangerAck(t) {
    return !!t && t.scene === 'mfg-8d' && t.step === 4 && !t.dangerAcked;
  }

  /** 交还租约并停在 waiting 等人工确认，由用户到会话页裁决 */
  function handBackForAck(id) {
    adoptStop(id);
    Lease.release(id, {
      status: 'waiting',
      now: '等待确认：是否向供应商发送纠正措施要求邮件',
      reason: '高危动作需人工确认：对外发送邮件'
    }, function () { refresh(); });
  }

  /**
   * 接管任务的步骤推进：每一拍都在跨上下文互斥区内校验「租约仍属本页」再写
   * step / tokens / 产物 / 终态（Lease.renew 回调收到 null 即已易主），
   * 因此两个标签页不会同时推进同一个任务。
   * 互斥要靠异步的 Web Locks，取锁等待可能跨过一整个 tick 周期，多拍推进会在
   * 本页的临界区队列里堆积：因此一是按任务记在途标志，上一笔回调没回来就不发下
   * 一笔；二是把高危确认的判定挪进 patch 函数——它在互斥区内按最新快照执行，
   * 即便真有堆积，后一笔也会在锁内读到已推进到高危步的 step 并放弃提交，
   * 不会把人工确认边界静默越过。
   */
  function adoptTick(id) {
    if (advancing[id]) return;         // 上一拍的推进提交还没回结果，本拍不排队
    Store.refresh();
    var t = Store.rawTask(id);
    if (!t || t.status !== 'running') { adoptStop(id); refresh(); return; }
    // 租约已由别的页面接手（如用户打开了它的会话页）：本页停止推进
    if (t.leaseBy !== tabId) { adoptStop(id); refresh(); return; }
    var total = t.stepTotal || 1;
    // 高危动作不静默执行：连同租约一起交还
    if (needsDangerAck(t)) { handBackForAck(id); return; }
    if (t.step >= total) { adoptFinish(id, total); return; }
    var ackBlocked = false;
    advancing[id] = true;
    Lease.renew(id, function (cur) {
      if (cur.status !== 'running' || cur.step >= total) return null;
      // 锁内按最新快照复核：本笔排队期间 step 已被前一笔推到高危步且仍未确认，
      // 放弃提交，交由回调把任务停在 waiting 等人工确认
      if (needsDangerAck(cur)) { ackBlocked = true; return null; }
      return {
        step: cur.step + 1,
        now: '正在做第 ' + (cur.step + 1) + ' 步（任务中心接管推进）',
        tokens: cur.tokens + 22000 + Math.floor(Math.random() * 9000),
        cost: Math.round((cur.cost + 0.3 + Math.random() * 0.2) * 100) / 100
      };
    }, function (wrote) {
      delete advancing[id];            // 成功、放弃、租约易主三种结果都要清标志
      if (ackBlocked) { handBackForAck(id); return; }
      if (!wrote) { adoptStop(id); refresh(); return; }
      refresh();
    });
  }

  /** 接管任务落终态并交还租约与名额，名额交还后继续接管下一个队首 */
  function adoptFinish(id, total) {
    adoptStop(id);
    var t = Store.rawTask(id);
    if (!t) return;
    var title = t.title;
    var failed = t.scene === 'edu-crosscheck' && !t.retried;
    // 终态与交还租约同处一笔互斥区内的提交；租约已易主则整体不写，不覆盖别人的结果
    var patch = failed
      ? {
          status: 'failed', step: total - 1, failedStep: total - 1, now: '执行失败',
          reason: '数据源解析失败：《科研系统-项目负责人清单.xlsx》存在合并单元格，表头无法定位。' +
                  '建议拆分合并单元格后重试，或改为按「以人事系统为准」策略跳过该表。'
        }
      : { status: 'done', step: total, now: '已完成' };
    Lease.release(id, patch, function (wrote) {
      if (wrote) {
        App.Toast.show(failed ? '任务执行失败' : '任务已完成',
          title + (failed ? ' · 中间物与检查点已保留' : ''), failed ? 'err' : 'ok', 6000);
      }
      refresh();
      scheduleQueued();
    });
  }

  Store.onChange(function () { refresh(); scheduleQueued(); });
  setInterval(function () { Store.refresh(); refresh(); scheduleQueued(); }, POLL_MS);
  /* 离开页面即收掉接管中的推进循环，并把本页持有的租约交还：不交还的话任务会停在
     running 无人推进。pagehide 里等不到异步回调，因此只发起提交——提交本身仍在
     互斥区内做所有权校验，不会覆盖别人的结果；万一没来得及落盘（进程被杀），
     其它长驻页面仍可在 Lease.TTL 后按「租约已过期」接管 */
  window.addEventListener('pagehide', function () {
    Object.keys(adopted).forEach(function (id) {
      adoptStop(id);
      var cur = Store.rawTask(id);
      if (!cur || cur.leaseBy !== tabId) return;
      Lease.release(id, cur.status === 'running'
        ? { now: '执行中：原推进页面已关闭，等待其它页面接管' } : {});
    });
    // 在途标志一并清掉：页面卸载后这些提交的回调不会再回来，留着会让页面从
    // 后台缓存恢复后第一拍推进被永久挡住
    Object.keys(advancing).forEach(function (id) { delete advancing[id]; });
  });
  scheduleQueued();
})();
</script>
