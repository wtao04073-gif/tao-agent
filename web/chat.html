	function togglePlus(menuEl) {
		var willOpen = !menuEl.classList.contains("open");
		closePlusMenus();
		if (willOpen) menuEl.classList.add("open");
	}
	document.addEventListener("click", function (e) {
		if (!e.target.closest || !e.target.closest(".plus-wrap")) closePlusMenus();
	});
	$("#lFile").addEventListener("change", function () { trackUploads($("#lFile"), $("#lAttachRow")); });
	$("#sFile").addEventListener("change", function () { trackUploads($("#sFile"), $("#attachRow")); });

	/* ---------- 技能 / 智能体 选择与上传 ---------- */
	var addonReturnFocus=null;
    var addonCache = { skill: [], agent: [] }; // 最近一次拉到的列表
	// 弹层当前上下文：kind = skill | agent；tab = pick | new
	var addonCtx = { kind: "skill", tab: "pick", picked: null, pickedSkillIds: [] };

	function esc(s) {
		return String(s == null ? "" : s)
			.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;");
	}

	function openAddonPicker(kind) {
		addonReturnFocus=document.activeElement;
        addonCtx.kind = kind;
		addonCtx.tab = "pick";
		addonCtx.picked = null;
		$("#addonTitle").textContent = kind === "agent" ? "选择智能体" : "选择技能";
		$("#addonNameLabel").textContent = "智能体名称";
		$("#addonContentLabel").textContent =
			kind === "agent" ? "系统提示词（角色设定 / 规则 / 输出要求）" : "技能指令（Markdown，写明要遵循的规则）";
		$("#addonName").value = ""; $("#addonDesc").value = ""; $("#addonContent").value = "";
		$("#agentSkillPick").style.display = kind === "agent" ? "" : "none";
		switchAddonTab("pick");
		$("#addonModal").classList.add("open");
        $("#addonCancel").focus();
		refreshAddonList();
	}
	function closeAddonPicker() { var opened=$("#addonModal").classList.contains("open");$("#addonModal").classList.remove("open");if(opened&&addonReturnFocus&&addonReturnFocus.isConnected){var opener=addonReturnFocus;queueMicrotask(function(){var parent=opener.closest('.plus-menu');if(parent)parent.classList.add('open');opener.focus();});} }
    $("#addonModal").addEventListener('keydown',function(e){
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeAddonPicker();return;}
      if(e.key!=='Tab')return;var focusable=Array.from(this.querySelectorAll('button,input,textarea,select,[tabindex="0"]')).filter(function(el){return !el.disabled&&el.getClientRects().length;});
      var first=focusable[0],last=focusable[focusable.length-1];if(!first)return;
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    });

	function switchAddonTab(tab) {
		addonCtx.tab = tab;
		$("#addonTabPick").classList.toggle("active", tab === "pick");
		$("#addonTabNew").classList.toggle("active", tab === "new");
		$("#addonPickPane").style.display = tab === "pick" ? "" : "none";
		$("#addonFormPane").style.display = tab === "new" ? "" : "none";
		$("#addonSave").style.display = tab === "new" ? "" : "none";
		// “不使用”仅在选择页、且当前已选了同类扩展时出现
		$("#addonClear").style.display =
			tab === "pick" && (addonCtx.kind === "agent" ? state.agent : state.skill) ? "" : "none";
	}

	function currentSelectedId() {
		return addonCtx.kind === "agent"
			? (state.agent ? state.agent.agentId : null)
			: (state.skill ? state.skill.skillId : null);
	}

	function refreshAddonList(cursor) {
		var kind = addonCtx.kind;
		var url = kind === "agent" ? "/api/agents" : "/api/skills";
		var listEl = $("#addonList");
		listEl.innerHTML = '<div class="picker-empty">加载中…</div>';
		App.api("GET", url+"?limit=50&cursor="+(cursor||"0")).then(function (r) {
			if (!r.ok) { listEl.innerHTML = '<div class="picker-empty">加载失败，请重试</div>'; return; }
			var items = kind === "agent" ? (r.data.agents || []) : (r.data.skills || []);
			if(kind!==addonCtx.kind)return;
            if(cursor)items=addonCache[kind].concat(items);addonCache[kind] = items;
			renderAddonList(items);
            if(r.data.nextCursor){var more=document.createElement("button");more.textContent="加载更多";more.onclick=function(){refreshAddonList(r.data.nextCursor);};listEl.append(more);}
			if (kind === "agent") renderAgentSkillChecks(items);
		}).catch(function () { listEl.innerHTML = '<div class="picker-empty">网络异常，加载失败</div>'; });
	}

	function renderAddonList(items) {
		var listEl = $("#addonList");
		listEl.innerHTML = "";
		if (!items.length) {
			listEl.innerHTML = '<div class="picker-empty">还没有内容，点上方「上传 / 新建」创建一个</div>';
			return;
		}
		var selId = currentSelectedId();
		items.forEach(function (it) {
			var id = addonCtx.kind === "agent" ? it.agentId : it.skillId;
			var row = document.createElement("div");
			row.className = "addon-item" + (id === selId ? " sel" : "");
			row.innerHTML =
				'<div class="ai-main"><div class="ai-name">' + esc(it.name) +
				(it.builtin ? ' <span style="font-size:11px;color:var(--text-3)">预置</span>' : "") +
				'</div><div class="ai-desc">' + esc(it.description || "") + "</div></div>" +
				'<div class="ai-check">' + (id === selId ? "✓" : "") + "</div>";
			row.addEventListener("click", function () {
				addonCtx.picked = it;
				document.querySelectorAll("#addonList .addon-item").forEach(function (n) {
					n.classList.remove("sel"); n.querySelector(".ai-check").textContent = "";
				});
				row.classList.add("sel"); row.querySelector(".ai-check").textContent = "✓";
				applyPickedAddon(it);
			});
			if(!it.builtin){
              var kind=addonCtx.kind,actions=document.createElement('div');actions.className='addon-actions';
              var modify=document.createElement('button');modify.textContent='编辑';modify.type='button';
              modify.onclick=async function(e){e.stopPropagation();var content=await App.Dialog.prompt({title:'编辑'+it.name,label:'指令内容',multiline:true,value:kind==='agent'?it.systemPrompt:it.content});if(content===null)return;var body={};body[kind==='agent'?'systemPrompt':'content']=content;var r=await App.api('PATCH','/api/'+(kind==='agent'?'agents':'skills')+'/'+encodeURIComponent(id),body);if(!r.ok)toast(r.data.error);else refreshAddonList();};
              var remove=document.createElement('button');remove.textContent='删除';remove.type='button';
              remove.onclick=async function(e){e.stopPropagation();var yes=await App.Dialog.confirm({title:'删除'+it.name+'？',description:'已完成任务会保留原始执行记录。',danger:true});if(!yes)return;var r=await App.api('DELETE','/api/'+(kind==='agent'?'agents':'skills')+'/'+encodeURIComponent(id));if(!r.ok)toast(r.data.error);else{if(kind==='agent'&&state.agent&&state.agent.agentId===id)state.agent=null;if(kind==='skill'&&state.skill&&state.skill.skillId===id)state.skill=null;renderAddonChips();refreshAddonList();}};
              actions.append(modify,remove);row.append(actions);
            }
            listEl.appendChild(row);
		});
	}

	// 智能体新建表单里的技能多选（来自技能库）。
	function renderAgentSkillChecks() {
		var box = $("#agentSkillList");
		box.innerHTML = '<div class="picker-empty">加载中…</div>';
		App.api("GET", "/api/skills").then(function (r) {
			box.innerHTML = "";
			var skills = (r.ok && r.data.skills) || [];
			addonCtx.pickedSkillIds = [];
			if (!skills.length) { box.innerHTML = '<div class="picker-empty">暂无可用技能</div>'; return; }
			skills.forEach(function (s) {
				var lab = document.createElement("label");
				lab.style.cssText = "display:flex;gap:7px;align-items:flex-start;font-size:13px;color:var(--text-2);margin:6px 0";
				var cb = document.createElement("input");
				cb.type = "checkbox"; cb.style.marginTop = "3px";
				cb.addEventListener("change", function () {
					var i = addonCtx.pickedSkillIds.indexOf(s.skillId);
					if (cb.checked && i < 0) addonCtx.pickedSkillIds.push(s.skillId);
					if (!cb.checked && i >= 0) addonCtx.pickedSkillIds.splice(i, 1);
				});
				var span = document.createElement("span");
				span.textContent = s.name + " — " + (s.description || "");
				lab.appendChild(cb); lab.appendChild(span);
				box.appendChild(lab);
			});
		}).catch(function () { box.innerHTML = '<div class="picker-empty">技能加载失败</div>'; });
	}

	function applyPickedAddon(it) {
		if (addonCtx.kind === "agent") state.agent = it;
		else state.skill = it;
		renderAddonChips();
		closeAddonPicker();
		toast("已选择「" + it.name + "」，将在本次及后续对话中生效");
	}

	// 提交新建（技能或智能体），成功后自动选中并关闭弹层。
	function submitNewAddon() {
		var kind = addonCtx.kind;
		var name = $("#addonName").value.trim();
		var desc = $("#addonDesc").value.trim();
		var content = $("#addonContent").value.trim();
		if (!name) { toast("请填写名称"); return; }
		if (!content) { toast(kind === "agent" ? "请填写系统提示词" : "请填写技能指令"); return; }
		var btn = $("#addonSave"); btn.disabled = true;
		var url, body;
		if (kind === "agent") {
			url = "/api/agents";
			body = { name: name, description: desc, systemPrompt: content, skillIds: addonCtx.pickedSkillIds };
		} else {
			url = "/api/skills";
			body = { name: name, description: desc, content: content };
		}
		App.api("POST", url, body).then(function (r) {
			btn.disabled = false;
			if (!r.ok) { toast((r.data && r.data.error) || "创建失败"); return; }
			var id = kind === "agent" ? r.data.agentId : r.data.skillId;
			var it = kind === "agent"
				? { agentId: id, name: name, description: desc || "自定义智能体", systemPrompt: content,
					skillIds: addonCtx.pickedSkillIds, builtin: false }
				: { skillId: id, name: name, description: desc || "自定义技能", content: content, builtin: false };
			addonCache[kind].push(it);
			applyPickedAddon(it);
		}).catch(function () { btn.disabled = false; toast("网络异常，创建失败"); });
	}

	// 在两张输入卡渲染当前已选技能 / 智能体徽标。
	function renderAddonChips() {
		["#lAddonRow", "#sAddonRow"].forEach(function (sel) {
			var row = $(sel); if (!row) return;
			row.innerHTML = "";
			var add = function (icon, it, onRemove) {
				var chip = document.createElement("span");
				chip.className = "chipaddon";
				var t = document.createElement("span"); t.textContent = icon + " " + it.name;
				var x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "✕";
				x.title = "移除"; x.addEventListener("click", onRemove);
				chip.appendChild(t); chip.appendChild(x);
				row.appendChild(chip);
			};
			if (state.agent) add("🤖", state.agent, function () { state.agent = null; renderAddonChips(); });
			if (state.skill) add("🧩", state.skill, function () { state.skill = null; renderAddonChips(); });
			row.style.display = row.children.length ? "flex" : "none";
		});
	}

	$("#addonTabPick").addEventListener("click", function () { switchAddonTab("pick"); });
	$("#addonTabNew").addEventListener("click", function () { switchAddonTab("new"); });
	$("#addonClose").addEventListener("click", closeAddonPicker);
	$("#addonCancel").addEventListener("click", closeAddonPicker);
	$("#addonSave").addEventListener("click", submitNewAddon);
	$("#addonClear").addEventListener("click", function () {
		if (addonCtx.kind === "agent") state.agent = null; else state.skill = null;
		renderAddonChips(); closeAddonPicker();
	});
	$("#addonModal").addEventListener("click", function (e) {
		if (e.target === $("#addonModal")) closeAddonPicker();
	});

	document.querySelectorAll(".ex-grid .ex").forEach(function (c) {
		c.addEventListener("click", function () { $("#lInput").value = c.textContent; $("#lInput").focus(); });
	});
	$("#toggleDeliver").addEventListener("click", function () {
		var d = $("#deliver");
		// 桌面按 collapsed 切；移动端按 open 切（抽屉滑入/滑出）。
		if (isMobile()) d.classList.toggle("open");
		else d.classList.toggle("collapsed");
	});
	$("#deliverClose").addEventListener("click", hideDeliver);
	$("#newTask").addEventListener("click", resetAll);
	$("#cancelTask").addEventListener("click", cancelCurrentTask);
	$("#collapseRail").addEventListener("click", function () { setRail(!$('#rail').classList.contains('collapsed')); });
	$("#railToggle").addEventListener("click", function () { setRail(false); });
	$("#signOut").addEventListener("click", function () { App.Auth.signOut(); });




	$("#recentHead").addEventListener("click", function () {
		$(".recent").classList.toggle("collapsed");
	});
	$("#jobHead").addEventListener("click", function () {
		$(".rail-group").classList.toggle("collapsed");
	});
	$("#newJobBtn").addEventListener("click", newJob);
	["#lTier", "#sTier"].forEach(function (sel) {
		$(sel).addEventListener("change", function () { syncTier(this); });
	});

	function resetAll() {
        rememberView(null,null);
        state.previewOnly=false;
        saveDraft();selectDraft("new");
        TaoWorkspace.showChat();ChatUI.clearPreview();
		// 升代次 + 关 SSE：仍在完成的旧上传回调因 gen 不符不再写入 pending，
		// 旧任务事件也不会回流到新页面，实现跨任务隔离。
		closeSub();
		generation++;
		// 新建（＋）= 全新临时对话：清空会话与任务归属。
		state.taskId = null; state.conversationId = null; state.jobId = null; state.mode = "chat";
		state.running = false;
		state.booting = false; state.steps = null; state.answerP = null;
		state.pending = []; state.inFlight = [];
		state.skill = null; state.agent = null;
		state.seenSeq = null; state.seenArtifact = null; state.seenConfirm = null;
		state.deliverCleared = false;
		$("#session").classList.add("hidden");
		$("#landing").classList.remove("hidden");
		setRail(isMobile()); hideDeliver();
		$("#lInput").value = drafts.new || "";
		["#attachRow", "#lAttachRow"].forEach(function (sel) {
			$(sel).innerHTML = ""; $(sel).style.display = "none";
		});
		renderAddonChips();
		updateTopStatus(); updateSendEnabled();
	}

    function attachReference(file){
        if(state.running||state.booting){toast('请等待当前任务完成后引用资料');return false;}
        if(!file.path){toast('该资料没有可引用的文件');return false;}
        if(state.pending.some(function(f){return f.path===file.path;}))return true;
        state.pending.push({name:file.name,path:file.path});
        var row=(state.taskId||state.jobId||state.previewOnly)?$('#attachRow'):$('#lAttachRow');
        var chip=document.createElement('button');chip.type='button';chip.className='chipfile';chip.textContent='▤ '+file.name+' ×';
        chip.addEventListener('click',function(){state.pending=state.pending.filter(function(f){return f.path!==file.path;});chip.remove();refreshAttachRow();});row.append(chip);row.style.display='flex';return true;
    }
    function restoreChatView(){
        var hasSession=!!state.taskId||!!state.jobId||state.booting||state.previewOnly;
        $('#landing').classList.toggle('hidden',hasSession);$('#session').classList.toggle('hidden',!hasSession);
        $('#navChat').classList.add('active');
        if(isMobile())setRail(true);
    }
    TaoWorkspace.init({openTask:openExisting,openJob:openJob,newJob:newJob,
      attachFile:attachReference,showChat:restoreChatView,
      openPreview:function(file){
        if(!state.taskId&&!state.jobId&&!state.booting&&!state.previewOnly){
          state.previewOnly=true;$('#chatTitle').textContent='资料预览';
          $('#inner').replaceChildren();$('#sInput').value=$('#lInput').value;
          var from=$('#lAttachRow'),to=$('#attachRow');to.replaceChildren();
          while(from.firstChild)to.append(from.firstChild);
          from.style.display='none';to.style.display=to.children.length?'flex':'none';
        }
        TaoWorkspace.showChat();
        showDeliver();ChatUI.preview(null,file.name);
      }});
    $('#navChat').addEventListener('click',function(){TaoWorkspace.showChat();});
    $('#frontNewChat').addEventListener('click',resetAll);
    $('#railScrim').addEventListener('click',function(){setRail(true);});
    ['#lInput','#sInput'].forEach(function(sel){$(sel).addEventListener('input',function(){var value=this.value;$('#lInput').value=$('#sInput').value=value;drafts[currentDraft]=value;});});
    ['#lFile','#sFile'].forEach(function(sel){$(sel).accept='.txt,.md,.csv,.tsv,.docx,.xls,.xlsx,.pdf,.html,.xml,.json,.png,.jpg,.jpeg,.webp';});
    var searchTimer;$('#historySearch').addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadRecent();loadJobs();},200);});
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&!e.defaultPrevented&&!e.target.closest('dialog')){closePlusMenus();closeAddonPicker();hideDeliver();if(isMobile())setRail(true);}
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setRail(false);$('#historySearch').focus();}
    });
    window.addEventListener('hashchange',function(){if(isMobile())setRail(true);});
    var mobileLayout=window.matchMedia('(max-width: 980px)');
    mobileLayout.addEventListener('change',function(event){
      setRail(event.matches);
      hideDeliver();
    });
    if(mobileLayout.matches)setRail(true);
	App.api("GET", "/api/me").then(function (r) {
		if (!r.ok || !r.data) return;
		if (r.data.name) $("#userName").textContent = r.data.name;
		state.role = r.data.role || "member";

		// 模型选择器：旗舰常驻；后端配置了轻量档才出现该选项
		var flagship = (r.data.models && r.data.models.flagship) || "旗舰模型";
		var lite = r.data.models && r.data.models.lite;
		["#lTier", "#sTier"].forEach(function (sel) {
			var el = $(sel);
			el.innerHTML = "";
			var f = document.createElement("option");
			f.value = "flagship"; f.textContent = "旗舰 · " + flagship; el.appendChild(f);
			if (lite) {
				var l = document.createElement("option");
				l.value = "lite"; l.textContent = "轻量 · " + lite; el.appendChild(l);
			}
		});
	});
	updateTopStatus(); updateSendEnabled();
	// 场景名映射先加载（保证历史任务标题正确），再渲染最近任务；
	// 若带 ?task=<id>（从场景卡/任务中心跳入）则直接打开该任务会话。
	loadScenarioMap(function () {
		loadRecent();
		loadJobs();
		var qjob = new URLSearchParams(location.search).get("job");
		var qtid = new URLSearchParams(location.search).get("task");
		if (qjob) openJob(qjob);
		else if (qtid) openExisting(qtid);
	});
})();
</script>
<script src="/assets/admin-entry.js"></script>
<script src="/assets/branding.js" defer></script></body>
