<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tao Agent · 办公智能体</title>
<style>
	/* ===== 设计令牌（对齐 Inspire 原型：浅色企业 SaaS · blue 主色 · 大圆角 · 轻阴影） ===== */
	:root {
		--bg-app: #f8fafc;          /* slate-50 内容底 */
		--bg-white: #ffffff;       /* 侧栏 / 卡片 / 输入 */
		--bg-soft: #f8fafc;        /* slate-50 */
		--bg-soft-2: #f1f5f9;      /* slate-100：工具卡/标签 */
		--line: #e2e8f0;           /* slate-200 主描边 */
		--line-soft: #f1f5f9;      /* slate-100 弱描边 */
		--text: #1e293b;           /* slate-800 主文字 */
		--text-2: #475569;         /* slate-600 */
		--text-3: #94a3b8;         /* slate-400 占位/弱化 */
		--primary: #2563eb;        /* blue-600 */
		--primary-h: #1d4ed8;      /* blue-700 hover */
		--primary-soft: #eff6ff;   /* blue-50 */
		--primary-border: #bfdbfe; /* blue-200 */
		--indigo-soft: #eef2ff; --indigo: #4f46e5;
		--ok: #16a34a; --ok-soft: #f0fdf4;
		--warn: #d97706; --warn-soft: #fffbeb;
		--err: #dc2626; --err-soft: #fef2f2;
		--shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
		--shadow-side: 4px 0 24px rgba(15,23,42,.03);
		--radius-lg: 16px; --radius: 12px; --radius-sm: 10px;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg-app); color: var(--text);
		font-family: "PingFang SC","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
		font-size: 15px; line-height: 1.6; display:flex; height:100vh; overflow:hidden;
	}
	button { font-family: inherit; cursor: pointer; }

	/* ===== 左栏：会话/任务记录（对齐原型白侧栏） ===== */
	.rail {
		width: 260px; flex: 0 0 auto; background: var(--bg-white); border-right: 1px solid var(--line);
		display: flex; flex-direction: column; box-shadow: var(--shadow-side); z-index: 5;
		transition: margin-left .22s ease, width .22s ease;
	}
	.rail.collapsed { margin-left: -260px; }
	.rail-logo { height: 64px; display:flex; align-items:center; gap:8px; padding:0 24px;
		border-bottom: 1px solid var(--line-soft); flex-shrink:0; }
	.rail-logo .bot { width: 30px; height: 30px; border-radius: 9px; background: var(--primary);
		color:#fff; display:flex; align-items:center; justify-content:center; }
	.rail-logo b { font-size: 18px; letter-spacing:-.3px; color: var(--text); }
	.rail-search { padding: 16px 16px 8px; flex-shrink:0; }
	.rail-search .sbox { display:flex; align-items:center; gap:8px; background: rgba(241,245,249,.8);
		border:1px solid transparent; border-radius: var(--radius-sm); padding:8px 12px; }
	.rail-search input { border:none; background:transparent; outline:none; width:100%; font-size:13.5px;
		color: var(--text-2); }
	.rail-nav { flex:1; overflow-y:auto; padding: 4px 16px 8px; }
	.rail-nav::-webkit-scrollbar { display:none; }
	.nav-label { font-size:11px; font-weight:600; color: var(--text-3); letter-spacing:.08em;
		padding:8px 12px 4px; }
	.nav-item { width:100%; display:flex; align-items:center; gap:12px; border:none; background:transparent;
		padding:10px 12px; border-radius: var(--radius-sm); font-size:15px; font-weight:500;
		color: var(--text-2); text-align:left; }
	.nav-item:hover { background: var(--bg-soft); color: var(--text); }
	.nav-item.active { background: var(--primary-soft); color: var(--primary); }
	.nav-item svg { width:20px; height:20px; stroke: var(--text-3); flex-shrink:0; }
	.nav-item.active svg { stroke: var(--primary); }
	.recent { margin-top: 12px; }
	.recent-head { width:100%; display:flex; align-items:center; justify-content:space-between;
		background:transparent; border:none; font-size:11px; font-weight:600; color:var(--text-3);
		letter-spacing:.08em; padding:6px 12px; }
	.recent-item { width:100%; display:flex; align-items:center; gap:10px; border:none; background:transparent;
		padding:8px 12px; border-radius: 8px; font-size:13px; color:var(--text-2); text-align:left; }
	.recent-item:hover { background: var(--bg-soft); color: var(--text); }
	.recent-item .dot { width:7px; height:7px; border-radius:50%; background:var(--primary); flex-shrink:0; }
	.recent-item .dot.done { background:#cbd5e1; }
	.recent-item span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.rail-foot { padding:16px; border-top:1px solid var(--line-soft); flex-shrink:0; }
	.usercard { display:flex; align-items:center; gap:10px; background:var(--bg-soft);
		border:1px solid var(--line-soft); border-radius: var(--radius-sm); padding:8px 10px; }
	.avatar { width:34px; height:34px; border-radius:50%; color:#fff; font-size:13px; font-weight:600;
		display:flex; align-items:center; justify-content:center;
		background:linear-gradient(135deg,#60a5fa,#6366f1); flex-shrink:0; }
	.usercard .u { min-width:0; }
	.usercard .u b { display:block; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
	.usercard .u small { font-size:11px; color:var(--text-3); }
	.signout { margin-top:8px; width:100%; border:none; background:transparent; color:var(--text-3);
		font-size:12px; padding:6px; border-radius:8px; }
	.signout:hover { background:var(--bg-soft); color:var(--text-2); }

	/* 折叠后悬浮展开键 */
	.rail-toggle { position:fixed; top:14px; left:14px; z-index:40; width:36px; height:36px;
		border-radius:10px; border:1px solid var(--line); background:var(--bg-white); color:var(--text-2);
		display:none; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
	body.rail-off .rail-toggle { display:flex; }

	/* ===== 执行态：会话容器必须是横向 flex，撑满 body 剩余高度 ===== */
	#session.main { flex:1 1 auto; display:flex; min-height:0; min-width:0; height:100%; }

	/* ===== 中部：对话流 ===== */
	.conv { flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-white); }
	.chat-head { height:64px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 24px;
		border-bottom:1px solid var(--line); background:rgba(255,255,255,.85); backdrop-filter:blur(8px); }
	.chat-head .ttl { font-size:16px; font-weight:600; color:var(--text); }
	.chat-head .sp { flex:1; }
	.hbtn { border:1px solid var(--line); background:var(--bg-white); color:var(--text-2);
		border-radius:10px; padding:7px 12px; font-size:13px; }
	.hbtn:hover { background:var(--bg-soft); color:var(--text); }

	.stream { flex:1 1 auto; overflow-y:auto; background:var(--bg-white); }
	.inner { max-width: 860px; margin:0 auto; padding:28px 24px; }
	.msg { display:flex; gap:12px; margin-bottom:26px; }
	.msg .av { width:32px; height:32px; border-radius:50%; flex-shrink:0; margin-top:2px;
		display:flex; align-items:center; justify-content:center; font-size:13px; }
	.msg.user { flex-direction: row-reverse; }
	.msg.user .av { background:linear-gradient(135deg,#60a5fa,#6366f1); color:#fff; }
	.msg.bot .av { background:var(--primary-soft); border:1px solid var(--primary-border); color:var(--primary); }
	.bubble { max-width:80%; }
	.msg.user .bubble { max-width:75%; }
	.bubble .who { font-size:12px; font-weight:500; color:var(--text-3); margin:0 2px 4px; }
	.msg.user .who { text-align:right; }
	.bubble p { margin:0; white-space:pre-wrap; word-break:break-word; }
	.msg.user .bubble p { background:var(--primary); color:#fff; padding:10px 16px; border-radius:16px 16px 2px 16px;
		font-size:15px; box-shadow:var(--shadow-sm); display:inline-block; }
	.bottext { color:var(--text-2); font-size:15px; }

	/* 状态行 */
	.statusline { font-size:13px; color:var(--text-3); margin-top:6px; }
	.statusline .running { color:var(--primary); font-weight:500; }
	.statusline .retry-btn { border:none; background:none; color:var(--primary); font-size:13px;
		font-weight:500; cursor:pointer; padding:0; text-decoration:underline; }
	.statusline .retry-btn:hover { color:var(--primary-h); }

	/* 步骤聚合块（挂在智能体回答下） */
	.steps { margin-top:10px; border:1px solid var(--line); border-radius:var(--radius);
		background:var(--bg-soft); overflow:hidden; box-shadow:var(--shadow-sm); max-width:560px; }
	.steps-head { display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:13px;
		color:var(--text-2); cursor:pointer; user-select:none; }
	.steps-head .chev { transition:transform .2s; color:var(--text-3); }
	.steps.collapsed .chev { transform:rotate(-90deg); }
	.steps-head .summary { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.steps-head .state { font-size:12px; }
	.steps-body { padding:4px 14px 12px; }
	.steps.collapsed .steps-body { display:none; }
	.step { display:flex; gap:10px; padding:7px 0; font-size:14px; }
	.step .sic { width:22px; height:22px; border-radius:50%; flex-shrink:0; margin-top:1px;
		display:flex; align-items:center; justify-content:center; font-size:11px;
		border:1px solid var(--line); color:var(--text-3); background:var(--bg-white); }
	.step.done .sic { background:var(--ok); border-color:var(--ok); color:#fff; }
	.step.run .sic { background:var(--primary); border-color:var(--primary); color:#fff; }
	@keyframes spin { to { transform:rotate(360deg); } }
	.step.run .sic { animation: spin 1.1s linear infinite; }
	.step .sact { flex:1; }
	.step .sact .t { color:var(--text); }
	.step.wait .sact .t { color:var(--text-3); }
	.step .sact .d { font-size:12px; color:var(--text-3); margin-top:1px; }
	.step .sst { font-size:12px; color:var(--text-3); white-space:nowrap; }
	.step.done .sst { color:var(--ok); }
	.step.run .sst { color:var(--primary); }
	.progress { margin-top:10px; background:var(--bg-white); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
	.progress .pnum { font-size:16px; font-weight:600; color:var(--text); }
	.progress .pct { float:right; color:var(--primary); }
	.bar { height:6px; border-radius:99px; background:var(--bg-soft-2); margin:8px 0 6px; overflow:hidden; }
	.bar > i { display:block; height:100%; background:var(--primary); border-radius:99px; transition:width .4s; }
	.progress .pfoot { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); }

	/* 待确认卡片 */
	.confirm { margin-top:10px; border:1px solid #fdba74; border-radius:var(--radius);
		background:#fff7ed; padding:14px 16px; max-width:560px; }
	.confirm .ct { font-size:14px; font-weight:600; color:#c2410c; }
	.confirm .cd { font-size:13px; color:var(--text-2); margin:4px 0 10px; }
	.confirm .crow { display:flex; gap:10px; }
	.btn-primary { background:var(--primary); border:1px solid var(--primary); color:#fff; border-radius:10px;
		padding:9px 18px; font-size:14px; font-weight:500; box-shadow:var(--shadow-sm); }
	.btn-primary:hover { background:var(--primary-h); }
	.btn-primary:disabled { background:#cbd5e1; border-color:#cbd5e1; cursor:default; }
	.btn-2 { background:var(--bg-white); border:1px solid var(--line); color:var(--text-2); border-radius:10px;
		padding:9px 18px; font-size:14px; }
	.btn-2:hover { background:var(--bg-soft); }
	.msgstate { display:block; margin-top:4px; font-size:12px; color:var(--text-3); }

	/* ===== 右栏：交付物（保留的三屏元素） ===== */
	.deliver { flex:0 0 380px; background:var(--bg-white); border-left:1px solid var(--line);
		display:flex; flex-direction:column; min-height:0; transition:flex-basis .22s ease; }
	.deliver.collapsed { flex-basis:0; border-left-color:transparent; overflow:hidden; }
	.deliver-head { padding:18px 20px 12px; }
	.deliver-head h3 { margin:0; font-size:16px; font-weight:600; color:var(--text); }
	.deliver-head p { margin:2px 0 0; font-size:12px; color:var(--text-3); }
	.deliver-body { flex:1; overflow-y:auto; padding:8px 16px 20px; }
	.deliver-empty { color:var(--text-3); font-size:13px; text-align:center; margin-top:38vh; }
	.art { background:var(--bg-white); border:1px solid var(--line); border-radius:var(--radius);
		padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); }
	.art .ic { font-size:22px; }
	.art .meta { flex:1; min-width:0; }
	.art .nm { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.art .sub { font-size:12px; color:var(--text-3); }
	.art a { color:var(--primary); text-decoration:none; font-size:13px; font-weight:500; }

	/* ===== 输入区（对齐原型 Chat 输入卡） ===== */
	.composer { flex-shrink:0; padding:12px 24px 16px; background:var(--bg-white);
		box-shadow: 0 -4px 24px rgba(15,23,42,.03); }
	.cbox { max-width:1040px; margin:0 auto; }
	.queue-note { display:none; font-size:12px; color:var(--warn); margin-bottom:6px; }
	.attach-row { display:none; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
	.chipfile { font-size:12px; background:var(--bg-soft-2); border:1px solid var(--line); border-radius:99px;
		padding:3px 11px; color:var(--text-2); }
	.chipfile.uploading { color:var(--text-3); }
	.chipfile.failed { color:var(--err); border-color:#fecaca; }
	.inputcard { background:rgba(248,250,252,.6); border:1px solid var(--line); border-radius:var(--radius-lg);
		padding:8px; transition:border-color .15s, box-shadow .15s, background .15s; box-shadow:var(--shadow-sm); }
	.inputcard:focus-within { border-color:var(--primary); background:var(--bg-white);
		box-shadow:0 0 0 3px rgba(37,99,235,.12); }
	.ta { display:flex; align-items:flex-end; gap:8px; }
	.icon-btn { background:transparent; border:none; color:var(--text-3); font-size:18px; padding:8px; border-radius:10px; }
	.icon-btn:hover { background:var(--bg-soft-2); color:var(--text-2); }
	.icon-btn:disabled { opacity:.4; cursor:not-allowed; }
	textarea { flex:1; background:transparent; border:none; resize:none; outline:none; font-family:inherit;
		font-size:15px; line-height:1.5; color:var(--text); max-height:160px; min-height:24px; padding:8px 4px; }
	textarea::placeholder { color:var(--text-3); }
	.send { width:34px; height:34px; flex-shrink:0; border-radius:9px; border:none;
		background:var(--primary); color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center;
		box-shadow:var(--shadow-sm); cursor:pointer; }
	.send:hover { background:var(--primary-h); }
	.send:disabled { background:#e2e8f0; color:#fff; cursor:not-allowed; }
	.disclaimer { text-align:center; margin-top:9px; font-size:11px; color:var(--text-3); }
	/* 输入卡底部工具条：左侧＋菜单，右侧模型选择 + 发送（同一行，无分割线） */
	.composer-bar { display:flex; align-items:center; justify-content:space-between; gap:8px;
		padding:4px 2px 0; }
	.composer-bar .bar-left, .composer-bar .bar-right { display:flex; align-items:center; gap:8px; }
	/* ＋ 弹出选择菜单 */
	.plus-wrap { position:relative; display:inline-block; }
	.plus-menu { position:absolute; bottom:calc(100% + 8px); left:0; z-index:60; min-width:184px;
		background:var(--bg-white); border:1px solid var(--line); border-radius:12px;
		box-shadow:0 10px 30px rgba(15,23,42,.14); padding:6px; display:none; }
	.plus-menu.open { display:block; }
	.plus-menu button { display:flex; width:100%; align-items:center; gap:9px; text-align:left;
		background:transparent; border:none; border-radius:8px; padding:8px 10px; font-size:13px;
		color:var(--text); cursor:pointer; font-family:inherit; }
	.plus-menu button:hover { background:var(--bg-soft); }
	.plus-menu button .pm-ic { font-size:15px; width:18px; text-align:center; }
	.plus-menu button .pm-sub { display:block; font-size:11px; color:var(--text-3); margin-top:1px; }
	/* 已选技能 / 智能体 小徽标（可点 × 移除） */
	.chipaddon { display:inline-flex; align-items:center; gap:6px; font-size:12px;
		background:var(--bg-soft-2); border:1px solid var(--line); border-radius:99px;
		padding:4px 6px 4px 11px; color:var(--text-2); }
	.chipaddon .x { border:none; background:transparent; cursor:pointer; color:var(--text-3);
		font-size:13px; line-height:1; padding:0 3px; border-radius:50%; }
	.chipaddon .x:hover { color:var(--err); }
	/* 技能 / 智能体 选择弹层 */
	.modal-mask { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.42);
		display:none; align-items:center; justify-content:center; padding:20px; }
	.modal-mask.open { display:flex; }
	.modal { background:var(--bg-white); border-radius:16px; width:min(560px,100%);
		max-height:84vh; display:flex; flex-direction:column; overflow:hidden;
		box-shadow:0 24px 60px rgba(15,23,42,.28); }
	.modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
		border-bottom:1px solid var(--line); }
	.modal-head h3 { margin:0; font-size:15px; }
	.modal-close { border:none; background:transparent; font-size:18px; color:var(--text-3); cursor:pointer; }
	.modal-body { padding:14px 18px; overflow:auto; }
	.picker-tabs { display:flex; gap:8px; margin-bottom:12px; }
	.picker-tabs button { flex:1; padding:8px; border:1px solid var(--line); background:var(--bg-white);
		border-radius:9px; cursor:pointer; font-family:inherit; font-size:13px; color:var(--text-2); }
	.picker-tabs button.active { border-color:var(--primary, #4f7cf0); color:var(--primary, #4f7cf0);
		background:var(--bg-soft); }
	.addon-item { display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line);
		border-radius:11px; margin-bottom:9px; cursor:pointer; }
	.addon-item:hover { border-color:var(--primary, #4f7cf0); background:var(--bg-soft); }
	.addon-item.sel { border-color:var(--primary, #4f7cf0); background:var(--bg-soft); }
	.addon-item .ai-main { flex:1; min-width:0; }
	.addon-item .ai-name { font-size:13.5px; font-weight:600; }
	.addon-item .ai-desc { font-size:12px; color:var(--text-3); margin-top:2px; line-height:1.5; }
	.addon-item .ai-check { color:var(--primary, #4f7cf0); font-size:15px; }
	.addon-form { margin-top:6px; border-top:1px dashed var(--line); padding-top:14px; }
	.addon-form label { display:block; font-size:12px; color:var(--text-3); margin:10px 0 4px; }
	.addon-form input, .addon-form textarea { width:100%; box-sizing:border-box; border:1px solid var(--line);
		border-radius:9px; padding:8px 10px; font-family:inherit; font-size:13px; resize:vertical; }
	.addon-form textarea { min-height:84px; }
	.modal-foot { padding:12px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:9px; }
	.btn { border:1px solid var(--line); background:var(--bg-white); color:var(--text-2); border-radius:9px;
		padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
	.btn-primary { background:var(--primary, #4f7cf0); border-color:var(--primary, #4f7cf0); color:#fff; }
	.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
	.picker-empty { font-size:13px; color:var(--text-3); text-align:center; padding:22px 0; }
	.model-pick { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text-3);
		background:var(--bg-soft-2); border:1px solid var(--line); border-radius:9px;
		padding:3px 6px 3px 8px; cursor:pointer; height:34px; box-sizing:border-box; }
	.model-pick:hover { color:var(--text-2); background:var(--bg-soft); }
	.tier-select { border:none; background:transparent; outline:none; font-family:inherit; font-size:12px;
		color:var(--text-2); cursor:pointer; max-width:150px; padding:1px 0; }
	.hbtn-danger { color:var(--err); }
	.hbtn-danger:hover { background:#fef2f2; }
	.recent-caret { color:var(--text-3); font-size:11px; transition:transform .2s; }
	.recent.collapsed #recentList { display:none; }
	.recent.collapsed .recent-caret { transform:rotate(-90deg); }
	.rail-group { margin-top:6px; }
	.rail-group.collapsed #jobList, .rail-group.collapsed .new-job-btn { display:none; }
	.rail-group.collapsed .recent-caret { transform:rotate(-90deg); }
	.new-job-btn { width:100%; margin:6px 0 4px; padding:7px 10px; font-size:12.5px;
		border:1px dashed var(--primary-border, #93b4f5); color:var(--primary);

		border-radius:12px; padding:14px 16px; margin:4px 0 12px; }
	.job-header .jh-title { font-size:13px; font-weight:600; color:var(--primary); margin-bottom:6px; }
	.job-header .jh-goal { font-size:14px; color:var(--text, #1f2937); line-height:1.6; }
	.job-header .jh-mem-title { font-size:12px; font-weight:600; color:var(--text-2); margin:12px 0 6px; }
	.job-header .jh-mem { margin:0; padding-left:18px; }
	.job-header .jh-mem li { font-size:12.5px; color:var(--text-2); line-height:1.6; margin-bottom:4px; }
	.conv-sep { font-size:11px; color:var(--text-3); text-align:center; margin:18px 0 8px;
		position:relative; }
	.conv-sep::before, .conv-sep::after { content:""; display:inline-block; width:48px; height:1px;
		background:var(--line, #e5e7eb); vertical-align:middle; margin:0 10px; }

	/* ===== 空态 landing（对齐原型 Chat idle，居中） ===== */
	.landing { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
		padding:24px; overflow-y:auto; background:var(--bg-white); }
	.landing .hero-ic { width:64px; height:64px; border-radius:20px; margin-bottom:22px;
		background:linear-gradient(135deg,#dbeafe,#eef2ff); border:1px solid var(--primary-border);
		display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:30px; }
	.landing h1 { font-size:26px; font-weight:600; color:var(--text); margin:0 0 8px; text-align:center; }
	.landing .lead { color:var(--text-3); font-size:13px; margin:0 0 30px; text-align:center; }
	.landing .lcard { width:min(880px,94vw); }
	.ex-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
	.ex { text-align:left; background:var(--bg-soft); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
		padding:13px 15px; font-size:13px; font-weight:500; color:var(--text-2); }
	.ex:hover { background:var(--primary-soft); color:var(--primary); border-color:var(--primary-border); }

	.toast { position:fixed; top:72px; left:50%; transform:translateX(-50%);
		background:var(--text); color:#fff; font-size:13px; padding:9px 16px; border-radius:10px;
		opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; box-shadow:var(--shadow-sm); }
	.toast.show { opacity:1; }
	.hidden { display:none !important; }
	/* 移动端交付物抽屉关闭按钮（桌面隐藏） */
	.deliver-close { display:none; }
	@media (max-width: 980px) {
		.rail { position:absolute; z-index:30; height:100%; }
		/* 交付物为覆盖式抽屉：默认滑出视口外（不挡对话），.open 才滑入；
		   .collapsed 在移动端同样保持隐藏，避免绝对定位铺满且关不掉。 */
		.deliver {
			flex-basis:auto; position:absolute; inset:0; z-index:25;
			transform:translateX(100%); transition:transform .22s ease;
		}
		.deliver.open { transform:translateX(0); }
		.deliver-close {
			display:inline-flex; align-items:center; justify-content:center;
			width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
			background:var(--bg-white); color:var(--text-2); font-size:16px; line-height:1;
		}
	}
</style>

<script>
(function () {
	"use strict";
	var $ = function (s, r) { return (r || document).querySelector(s); };
	var esc = App.esc;
    App.Theme.init();

	if (!App.Auth.signedIn && localStorage.getItem('tao.password-session')!=='true') { location.href = "/login.html"; return; }

	// pending：已上传完成待发附件；inFlight：在途上传 Promise 集合（未清空禁发）。
	// generation：页面/任务代次，每次重置 +1；旧代次发起的上传即使晚完成也作废，
	// 不得再写入新代次的 pending，杜绝跨任务污染。
	var generation = 0,toolInputs=Object.create(null),capabilities={};
    App.api("GET","/api/capabilities").then(function(r){if(r.ok)capabilities=r.data;});
    var drafts=Object.create(null),currentDraft="new";
    function saveDraft(){drafts[currentDraft]=$($("#landing").classList.contains("hidden")?"#sInput":"#lInput").value;}
    function selectDraft(key){currentDraft=key;$('#sInput').value=$('#lInput').value=drafts[key]||'';}

	var state = { taskId: null, conversationId: null, jobId: null, mode: "chat", sub: null,
		running: false, booting: false, previewOnly: false, steps: null,
		pending: [], inFlight: [], role: "member",
		answerP: null,
		// 本次草稿选用的技能 / 智能体（跨轮沿用，直到手动移除或新建清空）。
		skill: null, agent: null,
		seenSeq: null, seenArtifact: null, seenConfirm: null, deliverCleared: false };

    var runDisplay=ChatRunDisplay.create({document:document,storage:{getItem:function(k){return localStorage.getItem(k);},setItem:function(k,v){localStorage.setItem(k,v);}},
        answerNode:answerParagraph,currentBubble:function(){return state.statusEl?state.statusEl.closest(".bubble"):addMsg("bot","智能体","");},
        renderAnswer:function(node,text){ChatUI.renderAnswer(node,text);},answerFinished:function(){if(state.answerP)state.answerP.dataset.final='true';state.answerP=null;},changed:scrollDown});
    document.querySelectorAll(".composer-bar .bar-left").forEach(function(parent){runDisplay.mount(parent);});

	// 当前选中的模型档位；两个输入卡的选择器始终保持同步。
	function currentTier() {
		var s = $("#sTier");
		return s && s.value === "lite" ? "lite" : "flagship";
	}
	function syncTier(from) {
		["#lTier", "#sTier"].forEach(function (sel) {
			var el = $(sel);
			if (el && el !== from) el.value = from.value;
		});
	}

	function isMobile() { return window.matchMedia("(max-width: 980px)").matches; }
	// 交付物显隐：桌面用 collapsed 收窄，移动端用 open 控制抽屉滑入/滑出。
	function showDeliver() {
		$("#deliver").classList.remove("collapsed");
		if (isMobile()) $("#deliver").classList.add("open");
	}
	function hideDeliver() {
		$("#deliver").classList.add("collapsed");
		$("#deliver").classList.remove("open");
	}

	function toast(msg) {
		var t = $("#toast"); t.textContent = msg; t.classList.add("show");
		setTimeout(function () { t.classList.remove("show"); }, 2600);
	}

	/* ---------- 附件（在途追踪 + 发送门） ---------- */
	function trackUploads(fileInput, rowEl) {
		var gen = generation;                 // 绑定本次选择所属代次
		var files = Array.prototype.slice.call(fileInput.files || []);
		fileInput.value = "";
		if (!files.length) return;
		files.forEach(function (f) {
			var chip = document.createElement("span");
			chip.className = "chipfile uploading"; chip.textContent = "⏳ " + f.name;
			rowEl.appendChild(chip); rowEl.style.display = "flex";
			// 每个上传独立 Promise，完成后只移除自己，绝不清空共享 inFlight。
			var p = App.upload("/api/files", f, "file")
				.then(function (r) {
					if (gen !== generation) return;   // 已重置/换任务：结果作废，不写 pending
					if (!r.ok) throw new Error((r.data && r.data.error) || "上传失败");
					state.pending.push({ name: f.name, path: r.data.path });
					chip.classList.remove("uploading"); chip.textContent = "📎 " + f.name;
				})
				.catch(function (e) {
					if (gen !== generation) return;
					chip.textContent = "⚠ " + f.name + "（上传失败，点击移除）";
					chip.classList.add("failed"); chip.style.cursor = "pointer";
					toast("附件上传失败：" + f.name);
					chip.addEventListener("click", function () { chip.remove(); refreshAttachRow(); });
					throw e;
				})
				.then(function () { settleOne(p); }, function () { settleOne(p); });
			state.inFlight.push(p);
		});
		updateSendEnabled();
	}
	// 单个上传结算后从共享集合精确移除；仅当全部在途都结束才解除发送门。
	function settleOne(p) {
		var i = state.inFlight.indexOf(p);
		if (i >= 0) state.inFlight.splice(i, 1);
		if (state.inFlight.length === 0) { updateSendEnabled(); refreshAttachRow(); }
	}
	function uploading() { return state.inFlight.length > 0; }
	function refreshAttachRow() {
		["#attachRow", "#lAttachRow"].forEach(function (sel) {
			var row = $(sel);
			if (row && !row.querySelector(".chipfile")) row.style.display = "none";
		});
	}
	function updateSendEnabled() {
		["#lSend", "#sSend"].forEach(function (sel) {
			var b = $(sel); if (!b) return;
			b.disabled = uploading() || state.booting;
			b.title = uploading() ? "附件仍在上传，请稍候"
				: (state.booting ? "任务正在启动，请稍候" : "");
		});
	}

	/* ---------- 左栏：折叠 + 最近任务 ---------- */
	function setRail(collapsed) {
        $("#railScrim").classList.toggle("open", isMobile() && !collapsed);
		$("#rail").classList.toggle("collapsed", collapsed);
		document.body.classList.toggle("rail-off", collapsed);
        ['#railToggle','#collapseRail'].forEach(function(selector){
          var button=$(selector);button.setAttribute('aria-expanded',String(!collapsed));
          button.setAttribute('aria-controls','rail');
          button.setAttribute('aria-label',collapsed?'展开导航':'收起导航');
          button.title=collapsed?'展开导航':'收起导航';
        });
	}
	var scenarioMap = { "general.free-task": "通用任务" };
	function loadScenarioMap(cb) {
		App.api("GET", "/api/scenarios").then(function (r) {
			if (r.ok && Array.isArray(r.data.scenarios)) {
				r.data.scenarios.forEach(function (c) { scenarioMap[c.id] = c.title; });
			}
			if (cb) cb();
		});
	}
	function taskTitle(t) {
		// 多轮对话优先用服务端生成的标题（首轮 query 摘要）；老数据退回场景名。
		return (t.title && t.title.trim()) || scenarioMap[t.scenarioId] ||
			(t.scenarioId ? t.scenarioId : "未命名对话");
	}
	// 左栏「最近对话」：只显示不属于任何长程任务的会话，按 conversationId 聚合。
    var recentRequest=0,recentCursor=null;
    function loadRecent(more) {
      var request=++recentRequest,q=$('#historySearch').value.trim(),cursor=more&&recentCursor?recentCursor:'0';
      App.api('GET','/api/conversations?standalone=true&limit=20&cursor='+encodeURIComponent(cursor)+'&q='+encodeURIComponent(q)).then(function(r){
        if(request!==recentRequest||!r.ok)return;var box=$('#recentList');if(!more)box.replaceChildren();
        var old=box.querySelector('.load-more');if(old)old.remove();
        (r.data.conversations||[]).forEach(function(t){
          var b=document.createElement('button');b.className='recent-item';b.textContent=t.title||'对话';b.title=b.textContent;
          b.addEventListener('click',function(){openExisting(t.taskId||t.taskIds[t.taskIds.length-1]);});box.append(b);
          var manage=document.createElement('button');manage.className='recent-manage';manage.textContent='管理';manage.setAttribute('aria-label','管理对话 '+t.title);
          manage.onclick=async function(){
            var title=await App.Dialog.prompt({title:'重命名对话',label:'对话名称',value:t.title,description:'修改显示名称；删除操作可在任务中心进行。'});
            if(title===null)return;var r=await App.api('PATCH','/api/conversations/'+encodeURIComponent(t.conversationId),{title:title});if(!r.ok)toast(r.data.error);else loadRecent();
          };box.append(manage);
        });
        recentCursor=r.data.nextCursor;if(recentCursor){var moreButton=document.createElement('button');moreButton.className='recent-item load-more';moreButton.textContent='加载更多';moreButton.onclick=function(){moreButton.disabled=true;loadRecent(true);};box.append(moreButton);}
      });
    }

	// 左栏「项目与长期任务」：拉取长程任务列表。
    var jobsRequest=0,jobsCursor=null;
	function loadJobs(more) {
		var request=++jobsRequest;App.api("GET", "/api/jobs?limit=20&cursor="+(more&&jobsCursor?jobsCursor:"0")+"&q="+encodeURIComponent($("#historySearch").value.trim())).then(function (r) {
			if (request!==jobsRequest||!r.ok || !Array.isArray(r.data.jobs)) return;
			var box = $("#jobList"); if(!more)box.innerHTML = "";var previous=box.querySelector(".load-more");if(previous)previous.remove();
			r.data.jobs.forEach(function (j) {
				var b = document.createElement("button"); b.className = "recent-item job-item";
				var done = j.status === "done" || j.status === "archived";
				b.innerHTML = '<span class="dot' + (done ? " done" : "") + '"></span>' +
					'<span class="t"></span><span class="jtag"></span>';
				b.querySelector(".t").textContent = j.title;
				b.querySelector(".jtag").textContent = (j.conversationIds || []).length + " 次会话";
				b.title = j.goal || j.title;
				(function (id) { b.addEventListener("click", function () { openJob(id); }); })(j.jobId);
				box.appendChild(b);
			});
            jobsCursor=r.data.nextCursor;if(jobsCursor){var button=document.createElement('button');button.className='recent-item load-more';button.textContent='加载更多任务';button.onclick=function(){loadJobs(true);};box.append(button);}

		});

	// 新建长程任务：询问目标，建 Job 后进入任务视图。
	async function newJob() {
        var jobId = await App.Dialog.prompt({
            title: '新建长期任务', label: '任务目标', multiline: true,
            description: '为长期工作建立一个独立空间，持续记录对话、进展和交付物。',
            placeholder: '例如：开发一个客户管理系统，先梳理需求，再逐步完成设计与开发',
            requiredMessage: '请填写这个长期任务的目标', confirmText: '创建任务', busyText: '正在创建…',
            onSubmit: async function (goal) {
                var r = await App.api('POST', '/api/jobs', { goal: goal });
                if (!r.ok) throw new Error(r.data && r.data.error || '创建失败，请稍后重试');
                if (!r.data || !r.data.jobId) throw new Error('未收到任务编号，请先到任务中心确认创建结果');
                return r.data.jobId;
            }
        });
        if (jobId !== null) { loadJobs(); openJob(jobId); }
    }

	// 打开长程任务：显示目标与历次会话，可继续发起新会话。
	function openJob(jobId) {
        rememberView(null,jobId);
        saveDraft();
		enterSessionShell("任务");
		var gen = generation;
		state.mode = "job"; state.jobId = jobId; state.booting = true;selectDraft("job:"+jobId);
		App.api("GET", "/api/jobs/" + encodeURIComponent(jobId)).then(function (r) {
			if (gen !== generation || state.jobId !== jobId) return;
			if (!r.ok || !r.data) { detailLoadFailed(); return; }
			var job = r.data;
			$("#chatTitle").textContent = job.title;
			renderJobHeader(job);
			renderJobHistory(gen, job, function () {
				if (gen !== generation) return;
				state.booting = false;
				updateTopStatus(); updateSendEnabled();
			});
		}).catch(function () {
			if (gen === generation && state.jobId === jobId) detailLoadFailed();
		});
	}

	// 任务视图顶部：目标 + 历次会话沉淀的长期记忆。
	function renderJobHeader(job) {

	// 渲染长程任务下全部会话（按 conversationId 分组、时间排序），每会话逐轮回放。
    function renderJobHistory(gen,job,done){
      function load(cursor){App.api('GET','/api/jobs/'+encodeURIComponent(job.jobId)+'/events?limit=20&cursor='+cursor).then(function(r){
        if(gen!==generation)return;if(!r.ok){detailLoadFailed();return;}
        (r.data.rounds||[]).forEach(function(round,index){var last=!r.data.nextCursor&&index===r.data.rounds.length-1;
          if(last){state.taskId=round.task.taskId;state.conversationId=round.task.conversationId||null;}
          renderOneRound(round.task,round.events,last);
        });
        if(r.data.nextCursor)load(r.data.nextCursor);else{if(state.running&&state.taskId)subscribe(gen,state.taskId);if(done)done();}
      }).catch(function(){if(gen===generation)detailLoadFailed();});}
      load('0');
    }

	// 打开一个历史对话：按 conversationId 聚合其全部轮次渲染，并订阅最新一轮。
    function rememberView(taskId,jobId){var url=new URL(location.href);url.searchParams.delete('task');url.searchParams.delete('job');if(jobId)url.searchParams.set('job',jobId);else if(taskId)url.searchParams.set('task',taskId);history.replaceState(null,'',url.pathname+url.search+url.hash);}
	function openExisting(taskId) {
        rememberView(taskId,null);
        if(taskId===state.taskId && !state.booting){TaoWorkspace.showChat();return;}
        saveDraft();
		enterSessionShell("对话");
		var gen = generation;
		state.taskId = taskId;
		App.api("GET", "/api/tasks/" + encodeURIComponent(taskId)).then(function (r) {
			if (gen !== generation || state.taskId !== taskId) return;
			if (!r.ok || !r.data) { detailLoadFailed(); return; }
			state.conversationId = r.data.conversationId || taskId;selectDraft(state.conversationId);
			$("#chatTitle").textContent = taskTitle(r.data);
			state.running = r.data.status === "RUNNING" || r.data.status === "QUEUED" ||
				r.data.status === "AWAIT_CONFIRM";
			renderConversationHistory(gen, state.conversationId, r.data, function () {
				if (gen !== generation) return;
				state.booting = false; updateTopStatus(); updateSendEnabled();
				// 历史回放并标记已见 seq 后再订阅，避免 backlog 与历史渲染重复。
				if(state.running)subscribe(gen, state.taskId);
			});
		}).catch(function () {
			if (gen === generation && state.taskId === taskId) detailLoadFailed();
		});
	}

	// 拉取会话下所有轮任务，按创建顺序依次回放事件，重建完整多轮对话。
    function renderConversationHistory(gen, conversationId, latestTask, done) {
      function load(cursor){
        App.api('GET','/api/conversations/'+encodeURIComponent(conversationId)+'/events?limit=20&cursor='+cursor).then(function(r){
          if(gen!==generation)return;if(!r.ok){detailLoadFailed();return;}
          var rounds=r.data.rounds||[];
          rounds.forEach(function(round,index){
            var last=!r.data.nextCursor&&index===rounds.length-1;
            if(last){state.taskId=round.task.taskId;latestTask=round.task;}
            renderOneRound(round.task,round.events,last);
          });
          if(r.data.nextCursor)load(r.data.nextCursor);else if(done)done();
        }).catch(function(){if(gen===generation)detailLoadFailed();});
      }
      load('0');
    }

	// 由一轮事件流重建：用户问题、步骤、助手回答、产物。
	function renderOneRound(task, events, isLast) {
		var userText = "";
		var answerText = "", answerTexts = [];
		for (var i = 0; i < events.length; i++) {
			var e0 = events[i];
			if (e0.type === "user_message" && !userText) userText = e0.text;
			if (e0.type === "assistant_message") { answerText = e0.text; answerTexts.push(e0.text); }
            if(e0.type === "message_progress" && e0.channel === "answer" && runDisplay.preferences.stream)answerText=e0.text;
		}
		if (!userText) userText = task.title || "(本轮请求)";
		addMsg("user", "我", userText);
		var bot = addMsg("bot", "智能体", "");
		var savedSteps = state.steps;
        var effectiveStatus = task.status;
        events.forEach(function (e) { if (e.type === 'status' && ['QUEUED','RUNNING','AWAIT_CONFIRM'].includes(task.status)) effectiveStatus = e.to; });
        if(isLast && effectiveStatus==="AWAIT_CONFIRM")restoreConfirmations(task.taskId,generation);
        if (isLast) state.running = ['QUEUED','RUNNING','AWAIT_CONFIRM'].includes(effectiveStatus);
        var holder = addStepsShell(bot, isLast && state.running);
		state.steps = holder;
		events.forEach(function (e) {
			if(e.type==="tool_decision")rememberToolInput(e);
            if (e.type === "step") renderStepEvent(e);
			if (e.type === "artifact" && e.final) renderArtifactEvent(Object.assign({},e,{taskId:task.taskId}));
		});
        runDisplay.history(bot, events);
        if (!events.some(function(e){return e.type === 'message_progress' || (e.type === 'assistant_message' && e.messageId);})) answerTexts.forEach(function (text, index) {
            var p = index === 0 ? bot.querySelector('p') : document.createElement('p');
            if (index > 0) bot.insertBefore(p, isLast && state.running ? state.statusEl : holder.root);
            p.classList.add('bottext', 'answer'); ChatUI.renderAnswer(p, text); p.dataset.final = 'true';
        });
        retryControl({taskId:task.taskId,status:effectiveStatus},bot);
        if(effectiveStatus==='FAILED'){
          var failure=document.createElement('div');failure.className='task-error';failure.setAttribute('role','alert');
          failure.textContent=ChatUI.errorMessage(task.reason);bot.appendChild(failure);
          holder.state.textContent='失败';
          if(!Object.keys(holder.rows).length)holder.root.hidden=true;
        }
		if (isLast) {
            state.steps = holder;
            state.activityStatus = effectiveStatus;
            state.activityAt = events.length ? events[events.length - 1].at : Date.now();
            state.activityKind = 'waiting';
            if (answerText && state.answerP) { state.answerP.dataset.final = 'true'; state.answerP = null; }
            if (state.running) updateActivity();
            else { settleSteps(effectiveStatus); state.statusEl = null; state.answerP = null; }
        } else { settleSteps(effectiveStatus); state.steps = savedSteps; }
		// 最新轮已由历史回放渲染：把它已落盘事件的 seq 标记为已见，
		// 避免随后 SSE backlog / 轮询把同一批事件再渲染一遍（重复气泡/步骤）。
		if (isLast) {
			events.forEach(function (e) {
				if (typeof e.seq === "number" && e.seq > 0) state.seenSeq[e.seq] = true;
			});
		}
		scrollDown();
	}

	// 在气泡内放一个步骤壳；最新运行轮复用 ensureRunView 的运行态样式（含状态行）。
	function addStepsShell(bot, live) {
		if (live) { ensureRunView(bot); return state.steps; }
		var steps = document.createElement("div");
		steps.className = "steps collapsed";
		steps.innerHTML =
			'<div class="steps-head"><span class="chev">▾</span>' +
			'<span class="summary">执行步骤</span><span class="state"></span></div>' +
			'<div class="steps-body"></div>';
		bot.appendChild(steps);
        steps.querySelector(".steps-head").addEventListener("click",function(){steps.classList.toggle("collapsed");});
		return { root: steps, body: $(".steps-body", steps), state: $(".state", steps),
			head: $(".steps-head", steps), rows: {}, order: [] };
	}
	function renderStepEvent(ev) {
        if (!state.steps) return;
        // 旧宿主的工具内部进度可能没有步骤编号；作为进展说明展示，不伪造第 0 步。
        if (!Number.isInteger(ev.step) || ev.step < 1) {
            if (ev.detail) state.steps.unscopedDetail = ev.detail;
            return;
        }
        var row = ensureStep(ev), phase = ev.phase;
        if(ev.toolCallId)row.dataset.toolCallId=ev.toolCallId;
        showToolDetails(row,ev.inputSummary||toolInputs[(ev.taskId||state.taskId)+":"+ev.toolCallId],ev.resultSummary);
        var toolHeader=row.querySelector('.tool-details summary');if(toolHeader&&ev.toolName)toolHeader.textContent=ev.toolName+' · 参数与结果（已脱敏）';
        if (phase === 'started' || phase === 'finished' || phase === 'failed') state.steps.unscopedDetail = '';
        row.dataset.phase = phase;
        row.querySelector('.t').textContent = ev.step + '. ' + (ev.action || '执行操作');
        if (ev.detail !== undefined) row.querySelector('.d').textContent = ev.detail;
        var active = phase === 'started' || phase === 'progress';
        row.className = 'step ' + (active ? 'run' : phase === 'failed' ? 'failed' : 'done');
        row.querySelector('.k').textContent = active ? '◌' : phase === 'failed' ? '✕' : '✓';
        row.querySelector('.sst').textContent = active ? '进行中' : phase === 'failed' ? '失败' : '已完成';
        updateStepSummary();
    }
    function showToolDetails(row,input,result){
      if(!input&&!result)return;
      var details=row.querySelector('.tool-details');if(!details){details=document.createElement('details');details.className='tool-details';var summary=document.createElement('summary');summary.textContent='工具参数与结果（已脱敏）';details.append(summary);row.append(details);}
      [['input',input],['result',result]].forEach(function(pair){if(!pair[1])return;var pre=details.querySelector('.tool-'+pair[0]);if(!pre){pre=document.createElement('pre');pre.className='tool-'+pair[0];details.append(pre);}pre.textContent=(pair[0]==='input'?'参数：\n':'结果：\n')+pair[1];});
    }
    function rememberToolInput(ev){if(ev.toolCallId&&ev.inputSummary){toolInputs[(ev.taskId||state.taskId)+":"+ev.toolCallId]=ev.inputSummary;if(state.steps)Object.values(state.steps.rows).forEach(function(row){if(row.dataset.toolCallId===ev.toolCallId)showToolDetails(row,ev.inputSummary);});}}
	function renderArtifactEvent(ev) {
		var key = ev.artifactId || (ev.name + "#" + ev.seq);
		if (state.seenArtifact[key]) return;
		state.seenArtifact[key] = true;
		addArtifact(ev);
	}

	/* ---------- 进入会话态（统一重置任务级状态） ---------- */
	function enterSessionShell(title) {
        state.previewOnly=false;
        TaoWorkspace.showChat();
        ChatUI.clearPreview();
		// 进入任一任务视图即进入新代次：关闭旧 SSE、作废仍在路上的上传回调、
		// 重置任务级去重集合。所有新任务/历史任务入口都经过这里。
		closeSub();
		generation++;
		// 所有会话入口（新建 / 打开历史）都在此切换到会话视图，避免新建路径漏切、
		// 导致任务已在后端运行而界面仍停留在空态。
		$("#landing").classList.add("hidden");
		$("#session").classList.remove("hidden");
		// 进入会话壳即清空旧任务标识并复位运行态：详情/创建接口返回前以 booting 闸门
		// 拦截一切发送，避免空窗期沿用上一任务 taskId/running 走错分支。
		state.taskId = null; state.conversationId = null; state.running = false; state.booting = true;
		state.pending = []; state.inFlight = []; state.answerP = null; state.steps = null; state.statusEl = null;
		// 默认进入临时对话模式；openJob 会在 shell 之后覆盖为 job 模式。
		state.mode = "chat"; state.jobId = null;
		// 同步清空附件标签行与文件输入：保证 pending/inFlight/发送按钮/可见标签四者一致，
		// 避免切换任务后界面残留旧附件标签却向后端发不含文件的任务。
		["#attachRow", "#lAttachRow"].forEach(function (sel) {
			$(sel).innerHTML = ""; $(sel).style.display = "none";
		});
		$("#lFile").value = ""; $("#sFile").value = "";
		$("#inner").innerHTML = "";
        runDisplay.reset();
		$("#deliverBody").innerHTML = '<div class="deliver-empty">交付物将在这里预览</div>';
		state.seenSeq = Object.create(null);
		state.seenArtifact = Object.create(null);
		state.seenConfirm = Object.create(null);
		state.deliverCleared = false;
		hideDeliver();
		$("#chatTitle").textContent = title || "任务";
		updateSendEnabled();
	}
	// 在给定智能体气泡内创建「状态行 + 步骤容器」，并初始化 state.steps/statusEl。
	// 新建任务与打开历史任务都必须先调用，否则 SSE 回放 step/status 会访问空对象。
	function ensureRunView(bot) {
		// 本轮回答写入该气泡自带的 <p>
		runDisplay.begin(bot);
        state.answerP = bot.querySelector("p");
		if (state.answerP) state.answerP.classList.add("bottext", "answer");
		var status = document.createElement("div");
		status.className = "statusline activity-line";
        status.innerHTML = '<span class="activity-dot" aria-hidden="true"></span><span class="activity-label" role="status" aria-live="polite">正在提交任务…</span><small class="activity-time" aria-hidden="true"></small>';
        state.activityStatus = 'QUEUED'; state.activityKind = 'waiting'; state.activityAt = Date.now(); state.streamDelayed = false;
		bot.appendChild(status); state.statusEl = status;
		var steps = document.createElement("div");
		steps.className = "steps";
		steps.innerHTML =
			'<div class="steps-head"><span class="chev">▾</span>' +
			'<span class="summary">执行步骤</span><span class="state"></span></div>' +
			'<div class="steps-body"></div>';
		bot.appendChild(steps);
		state.steps = { root: steps, body: $(".steps-body", steps), state: $(".state", steps),
			head: $(".steps-head", steps), rows: {}, order: [] };
		steps.querySelector(".steps-head").addEventListener("click", function () {
			steps.classList.toggle("collapsed");
		});
	}

	function enterSession(firstText) {
		enterSessionShell("新任务");
		addMsg("user", "我", firstText);
		var bot = addMsg("bot", "智能体", "");
		ensureRunView(bot);
		scrollDown();
	}

	function addMsg(role, who, text) {
		var m = document.createElement("div");
		m.className = "msg " + role;
		m.innerHTML = '<div class="av">' + (role === "user" ? "T" : "🤖") + "</div>" +
			'<div class="bubble"><div class="who"></div><p></p></div>';
		m.querySelector(".who").textContent = who;
		if(role === "bot" && text) ChatUI.renderAnswer(m.querySelector("p"), text); else m.querySelector("p").textContent = text || "";
		if(role==='user'){
          var edit=document.createElement('button');edit.type='button';edit.className='retry-btn';edit.textContent='编辑后重发';
          edit.onclick=async function(){if(state.running||state.booting){toast('请先等待任务结束');return;}var value=await App.Dialog.prompt({title:'编辑后重发',label:'新的请求内容',value:text||'',multiline:true,description:'编辑内容会作为当前会话的新一轮发送，历史内容保留。引用文件请重新选择。'});if(value!==null&&value.trim()){$('#sInput').value=$('#lInput').value=value;drafts[currentDraft]=value;$('#sInput').focus();}};
          m.querySelector('.bubble').append(edit);
        }
        $("#inner").appendChild(m);
		scrollDown();
		return m.querySelector(".bubble");
	}
	function scrollDown() { var s = $('#stream'); if(s.scrollHeight-s.scrollTop-s.clientHeight<280 || state.booting) s.scrollTop=s.scrollHeight; }

	/* ---------- 发起一轮对话（首轮或同会话续聊） ---------- */
	// continueConv=true 表示在当前已结束的会话里追问：复用 conversationId、追加气泡，
	// 不重建整页视图；false 表示从空态开启一个全新对话。
	function submit(text, continueConv) {
		if (uploading()) { toast("附件仍在上传，请稍候再发送"); return; }
		var files = state.pending.splice(0);
		["#attachRow", "#lAttachRow"].forEach(function (sel) {
			$(sel).innerHTML = ""; $(sel).style.display = "none";
		});
		$("#lFile").value = ""; $("#sFile").value = "";
		var tier = currentTier();

		var gen;
		if (state.mode === "job" && state.jobId) {
			// 长程任务下发送 = 开始一次新会话（新上下文组，但带 jobId 共享长期记忆）。
			closeSub(); generation++; gen = generation;
			beginRoundView(text + (files.length ? "\n\n引用资料："+files.map(function(f){return f.name;}).join("、") : ""), true);
			state.conversationId = null; // 新会话，等响应返回新 conversationId
		} else if (continueConv && state.conversationId) {
			// 临时对话续聊：关旧订阅、升代次，但保留 conversationId 与既有消息。
			closeSub(); generation++; gen = generation;
			beginRoundView(text + (files.length ? "\n\n引用资料："+files.map(function(f){return f.name;}).join("、") : ""), true);
		} else {
			enterSession(text + (files.length ? "\n\n引用资料："+files.map(function(f){return f.name;}).join("、") : "")); // 全新临时对话首轮：清空并重建视图
			gen = generation;
		}
		state.running = true; state.booting = true;
		updateTopStatus(); updateSendEnabled();

		var payload = { query: text, tier: tier };
		if (files.length) payload.files = files.map(function (f) { return f.path; });
		// 本次草稿选用的技能 / 智能体。
		if (state.skill) payload.skillId = state.skill.skillId;
		if (state.agent) payload.agentId = state.agent.agentId;
		// 长程任务：只带 jobId（后端开新会话）；临时续聊：带 conversationId。
		if (state.mode === "job" && state.jobId) payload.jobId = state.jobId;
		else if (state.conversationId) payload.conversationId = state.conversationId;

		sendPayload();
        function sendPayload(){App.api("POST", "/api/tasks", payload)
			.then(function (r) {
				if (gen !== generation) return;
				if (!r.ok) { fail((r.data && r.data.error) || "任务提交失败");submissionRetry(); return; }
				state.taskId = r.data.taskId;rememberView(state.taskId,state.mode==="job"?state.jobId:null);
				if (r.data.conversationId) {state.conversationId = r.data.conversationId;currentDraft=state.mode==="job"?"job:"+state.jobId:state.conversationId;drafts[currentDraft]="";$("#sInput").value=$("#lInput").value="";}
				state.booting = false; updateSendEnabled();
				subscribe(gen, r.data.taskId); loadRecent(); loadJobs();
			})
			.catch(function () { if (gen === generation) {fail("网络异常，提交结果暂未确认，请重试同步");submissionRetry();} });}
        function submissionRetry(){if(!state.statusEl)return;var b=document.createElement('button');b.className='retry-btn';b.textContent='重试提交';b.onclick=function(){b.remove();state.running=true;state.booting=true;updateSendEnabled();sendPayload();};state.statusEl.append(b);}

	}

	// 续聊一轮的视图：在现有对话下追加「用户气泡 + 新机器人运行气泡」，不清屏。
	function beginRoundView(userText, append) {
		// 重置本轮级去重与步骤容器，但保留交付物与历史消息。
		state.taskId = null;
		state.seenSeq = Object.create(null);
		state.seenConfirm = Object.create(null);
		addMsg("user", "我", userText);
		var bot = addMsg("bot", "智能体", "");
		ensureRunView(bot);
		scrollDown();
	}

	function closeSub() {
        clearInterval(activityTimer); activityTimer = null;
		if (state.sub) { try { state.sub.close(); } catch (e) {} state.sub = null; }
	}
	// 订阅绑定创建时的 taskId：旧任务流即使晚到，也会因 taskId/generation 不符被丢弃，
	// 不污染当前任务；切换前必须先 closeSub，避免 EventSource 与重连定时器泄漏。
	// gen/subTaskId 均由调用方在发起时捕获后传入，函数内不再重读 generation/state.taskId，
	// 避免“订阅读到的是切换后的新代次、绑定的却是旧任务”的竞态。
	function subscribe(gen, subTaskId) {
		closeSub();
        if (!state.running) return;
		state.sub = App.subscribe(subTaskId, {
			onEvent: function (ev) {
				if (gen !== generation || subTaskId !== state.taskId) return;
                onEvent(ev);
            },
            onOpen: function () { if (gen === generation && subTaskId === state.taskId) { state.streamDelayed = false; updateActivity(); } },
            onError: function () { if (gen === generation && subTaskId === state.taskId) { state.streamDelayed = true; updateActivity(); } }
        });
        if (state.running) activityTimer = setInterval(function () { updateActivity(); }, 1000);
    }

	/* ---------- 事件 → 步骤/交付物（seq 去重 + 幂等键） ---------- */
	var activityTimer = null;
	function ensureStep(ev) {
		var key = ev.step;
		var row = state.steps.rows[key];
		if (!row) {
			row = document.createElement("div");
			row.className = "step wait";
			row.innerHTML = '<div class="sic"><span class="k">◷</span></div>' +
				'<div class="sact"><div class="t"></div><div class="d"></div></div><div class="sst"></div>';
			state.steps.body.appendChild(row);
			state.steps.rows[key] = row; state.steps.order.push(key);
		}
		return row;
	}
	// 返回当前轮用于承载回答的 <p>（打字机增量与定稿都写这里）。
	// 当前轮的机器人气泡由 enterSession/ensureRunView 建好，状态行/步骤也在其中；
	// 回答文本应出现在同一个气泡里，而不是另起一个。
	function answerParagraph() {
		if (state.answerP && document.body.contains(state.answerP)) return state.answerP;
		// 兜底：找到当前轮气泡（含 statusEl 的那个机器人消息）。
		var bot = state.statusEl ? state.statusEl.closest(".bubble") : null;
		if (!bot) { bot = addMsg("bot", "智能体", ""); }
		var p = Array.from(bot.children).find(function (n) { return n.tagName === 'P' && n.dataset.final !== 'true'; });
        if (!p) { p = document.createElement('p'); bot.insertBefore(p, state.statusEl && state.statusEl.parentNode === bot ? state.statusEl : null); }
        p.classList.add("bottext", "answer");
		state.answerP = p;
		return p;
	}

	function onEvent(ev) {
		// 流式增量（seq=0）：不参与 seq 去重，直接做打字机追加。
        if (ev.type === 'assistant_delta' || ev.type === 'thinking_delta') {
            if (!state.running) return;
            state.activityKind = ev.type === 'assistant_delta' ? 'generating' : 'waiting';
            state.activityAt = Date.now(); updateActivity(); runDisplay.consume(ev); return;
        }
		// SSE 重连会从 seq=0 补投历史：按单调 seq 去重，避免重复交付物/确认卡/消息。
		if (typeof ev.seq === "number") {
			if (state.seenSeq[ev.seq]) return;
			state.seenSeq[ev.seq] = true;
		}
        if (runDisplay.consume(ev)) {
            state.activityKind = ev.type === 'assistant_message' ? 'waiting' : 'generating';
            state.activityAt = Date.now(); updateActivity(); return;
        }
        if (ev.type === "status") {
            state.activityStatus = ev.to; state.activityAt = Date.now(); state.activityKind = 'waiting';
            updateActivity();
            if (["SUCCEEDED","FAILED","CANCELLED","EXCEEDED","INTERRUPTED"].indexOf(ev.to) >= 0) finishRun(ev.to, ev.reason);
        } else if (ev.type === "step") {
            renderStepEvent(ev);
            state.activityKind = 'waiting'; state.activityAt = Date.now();
            updateActivity(); scrollDown();
		} else if (ev.type === "tool_decision") {
            rememberToolInput(ev);
			if (ev.decision === "await_confirm") {
				var ckey = ev.actionId || ev.toolName + "#" + ev.seq;
				if (!state.seenConfirm[ckey]) { state.seenConfirm[ckey] = true; showConfirm(ev); }
			}
		} else if (ev.type === "artifact") {
			if (ev.final) {
				var akey = ev.artifactId || (ev.name + "#" + ev.seq);
				if (!state.seenArtifact[akey]) { state.seenArtifact[akey] = true; addArtifact(ev); }
			}
		} else if (ev.type === "assistant_message") {
			// 定稿：用完整答案替换打字机增量（同一气泡）。去重已在外层按 seq 处理。
			if (ev.text) {
				var pf = answerParagraph();
				ChatUI.renderAnswer(pf,ev.text);
				pf.dataset.final = 'true'; state.answerP = null;
                state.activityKind = 'waiting'; state.activityAt = Date.now(); updateActivity();
				scrollDown();
			}
		} else if (ev.type === "user_message") {
			// 运行中插话由后端补发；正常首轮/续聊的用户气泡已在提交时上屏，这里幂等去重。
		}
	}
    function updateStepSummary() {
        if (!state.steps) return;
        var rows = Object.values(state.steps.rows), done = rows.filter(function (r) { return r.dataset.phase === 'finished'; }).length;
        var running = rows.filter(function (r) { return ['started','progress'].includes(r.dataset.phase); }).length;
        var failed = rows.filter(function (r) { return r.dataset.phase === 'failed'; }).length;
        state.steps.head.querySelector('.summary').textContent = rows.length
            ? '已完成 ' + done + ' / ' + rows.length + ' 步' + (running ? ' · ' + running + ' 步进行中' : '') + (failed ? ' · ' + failed + ' 步失败' : '') : '等待执行步骤';
    }
    function updateActivity() {
        if (!state.running || !state.statusEl || !state.steps) return;
        var rows = state.steps.order.map(function (key) { return state.steps.rows[key]; });
        var active = rows.filter(function (r) { return ['started','progress'].includes(r.dataset.phase); });
        var current = active[active.length - 1], label;
        if (state.activityStatus === 'AWAIT_CONFIRM') label = '等待你确认后继续';
        else if (state.activityStatus === 'QUEUED') label = '任务排队中，等待开始';
        else if (current) label = '正在执行：' + current.querySelector('.t').textContent + (current.querySelector('.d').textContent ? ' · ' + current.querySelector('.d').textContent : '');
        else label = state.activityKind === 'generating' ? '正在生成回答…' : state.steps.unscopedDetail ? '执行进展：' + state.steps.unscopedDetail : '正在等待模型响应…';
        if (current && state.steps.unscopedDetail) label += ' · ' + state.steps.unscopedDetail;
        if (state.streamDelayed) label = '实时连接恢复中，正在同步进度 · ' + label;
        var target = state.statusEl.querySelector('.activity-label');
        if (target && target.textContent !== label) target.textContent = label;
        var elapsed = Math.max(0, Math.floor((Date.now() - (state.activityAt || Date.now())) / 1000));
        var clock = state.statusEl.querySelector('.activity-time');
        if (clock) clock.textContent = elapsed >= 5 ? '距上次进展 ' + elapsed + ' 秒' : '';
        state.steps.state.textContent = state.activityStatus === 'AWAIT_CONFIRM' ? '待确认' : '执行中';
        state.statusEl.classList.add('is-active');
    }
    function settleSteps(to) {
        if (!state.steps) return;
        Object.values(state.steps.rows).forEach(function (row) {
            if (['started','progress'].includes(row.dataset.phase)) {
                row.dataset.phase = 'stopped'; row.className = 'step wait';
                row.querySelector('.k').textContent = '—';
                row.querySelector('.sst').textContent = to === 'SUCCEEDED' ? '未收到结果' : '已停止';
            }
        });
        updateStepSummary();
        state.steps.state.textContent = to === 'SUCCEEDED' ? '已完成' : to === 'FAILED' ? '失败' : '已停止';
        if (!state.steps.order.length) state.steps.root.hidden = true;
        if (to === 'SUCCEEDED') state.steps.root.classList.add('collapsed');
    }
    function finishRun(to, reason) {
        runDisplay.finish();
        state.running = false; updateTopStatus(); updateSendEnabled(); closeSub();
        settleSteps(to);
        if (state.statusEl) {
            state.statusEl.classList.remove('is-active');
            state.statusEl.classList.toggle('task-error', to === 'FAILED');
            state.statusEl.textContent = to === 'FAILED' ? ChatUI.errorMessage(reason)
                : to === 'SUCCEEDED' ? '本轮已完成' : to === 'EXCEEDED' ? '已达到执行限额，等待继续' : to === 'INTERRUPTED' ? '任务已中断' : '任务已取消';
        }
        if(state.statusEl)retryControl({taskId:state.taskId,status:to},state.statusEl);
        loadRecent(); scrollDown();
    }
	function fail(msg) {
		msg=ChatUI.errorMessage(msg);
		state.running = false; state.booting = false; closeSub();
		updateTopStatus(); updateSendEnabled();
		if (state.statusEl) { state.statusEl.classList.remove('is-active'); state.statusEl.textContent = msg; }
		toast(msg);
	}
	// 历史任务详情加载失败（业务失败或网络异常）：**保持启动闸门锁定**（running=false、
	// booting 保持 true），不开放发送——否则停留在该会话里发消息会因 !running 被误路由成
	// 静默新建任务。给独立「点击重试」重新拉详情，用户也可点左上角「＋ 新建」离开。
	function detailLoadFailed() {
		state.running = false; state.booting = true;
		updateTopStatus(); updateSendEnabled();
		if (state.statusEl) {
			state.statusEl.textContent = "";
			var msg = document.createElement("span");
			msg.textContent = "任务详情加载失败，";
			var retry = document.createElement("button");
			retry.type = "button"; retry.textContent = "点击重试";
			retry.className = "retry-btn";
			(function (id) {
				retry.addEventListener("click", function () { openExisting(id); });
			})(state.taskId);
			var tip = document.createElement("span");
			tip.textContent = "，或点左上角「＋ 新建」";
			state.statusEl.appendChild(msg); state.statusEl.appendChild(retry); state.statusEl.appendChild(tip);
		}
		toast("任务详情加载失败");
	}

    function restoreConfirmations(taskId,gen){
      App.api('GET','/api/tasks/'+encodeURIComponent(taskId)+'/actions').then(function(r){
        if(gen!==generation||!r.ok||capabilities.confirmation===false)return;
        (r.data.actions||[]).filter(function(a){return a.status==='pending'&&a.expiresAt>Date.now();}).forEach(function(a){if(!state.seenConfirm[a.actionId]){state.seenConfirm[a.actionId]=true;showConfirm(a);}});
      });
    }
    function retryControl(task,host){
      if(!['FAILED','CANCELLED','INTERRUPTED','EXCEEDED'].includes(task.status)||capabilities.retry===false)return;
      var button=document.createElement('button');button.type='button';button.className='retry-btn';button.textContent=task.status==='EXCEEDED'?'调整限额后重新执行':'重新执行';
      button.addEventListener('click',async function(){
        var yes=await App.Dialog.confirm({title:'重新执行任务',description:'将按原请求创建新任务，已完成的步骤可能再次执行。原有产物会保留。',confirmText:'重新执行'});if(!yes)return;
        button.disabled=true;
        try{var r=await App.api('POST','/api/tasks/'+encodeURIComponent(task.taskId)+'/retry',{});if(!r.ok)throw new Error(r.data.error||'重新执行失败');openExisting(r.data.taskId);loadRecent();}
        catch(e){toast(e.message);button.disabled=false;}
      });host.append(button);
    }
	function showConfirm(ev) {
		var box = document.createElement("div"); box.className = "confirm";
		box.innerHTML = '<div class="ct">⚠ 需要你确认一个操作</div>' +
			'<div class="cd"></div>' +
			'<div class="crow"><button class="btn-primary">确认执行</button>' +
			'<button class="btn-2">拒绝</button></div>' +
			'<div class="cerr" style="display:none;margin-top:8px;font-size:12.5px;color:var(--err)"></div>';
		box.querySelector(".cd").textContent = ev.toolName + (ev.reason ? " · " + ev.reason : "");
        showToolDetails(box,ev.inputSummary);
		var btn = box.querySelector(".btn-primary"), no = box.querySelector(".btn-2"),
			errEl = box.querySelector(".cerr");
		function failBtn(label, r) {
			btn.disabled = false; no.disabled = false; errEl.style.display = "block";
			errEl.textContent = label + "失败：" + ((r && r.data && r.data.error) || "请稍后重试");

			btn.disabled = true; no.disabled = true;
			App.api("POST", "/api/tasks/" + (ev.taskId || state.taskId) + "/confirm", ev.actionId ? { actionId: ev.actionId } : {}).then(function (r) {

			}).catch(function () { failBtn("确认", null); });
		});
		no.addEventListener("click", function () {

			App.api("POST", "/api/tasks/" + (ev.taskId || state.taskId) + "/reject", ev.actionId ? { actionId: ev.actionId } : {}).then(function (r) {
				if (r.ok) box.remove(); else failBtn("拒绝", r);
			}).catch(function () { failBtn("拒绝", null); });

		$("#inner").appendChild(box); scrollDown();
	}

	function addArtifact(ev) {

        var el=document.createElement("div");el.className="art";

	function updateTopStatus() {

	// 取消当前运行任务（二次确认），取消后状态由 SSE status 事件驱动刷新。
	async function cancelCurrentTask() {

	/* ---------- 追问 / 结束后再发（失败可见可重试） ---------- */
	function steer() {
		if (uploading()) { toast("附件仍在上传，请稍候再发送"); return; }
		// 启动闸门：仅拦截「详情/创建仍在进行」的空窗，且不动已输入文本。
		if (state.booting) { toast("任务正在启动，请稍候再发送"); return; }
		var ta = $("#sInput"); var text = ta.value.trim(); if (!text) return;
		ta.value = ""; autosize(ta);
		// 长程任务视图：每次发送都是该任务下的一次新会话（submit 内按 jobId 处理）。
		if (!state.running && state.mode === "job" && state.jobId) { submit(text, false); return; }
		// 临时对话已结束但仍在同一会话：带 conversationId 续聊一轮（模型记得上文）。
		if (!state.running && state.conversationId) { submit(text, true); return; }
		// 无 taskId（上一次创建失败）：作为全新对话重新发起，可直接重试。
		if (!state.taskId || !state.running) { submit(text, false); return; }
		if (state.pending.length) {
			ta.value = text; autosize(ta);
			toast("任务执行中暂不能追加附件，可在任务结束后随新任务发送，或先发文字要求");
			return;
		}
		var bubble = addMsg("user", "我", text);
		var tag = document.createElement("span");
		tag.className = "msgstate"; tag.textContent = "发送中…";
		bubble.appendChild(tag); scrollDown();
		App.api("POST", "/api/tasks/" + state.taskId + "/steer", { text: text })
			.then(function (r) {
				if (r.ok) { tag.textContent = "将在当前步骤完成后送达"; tag.style.color = "var(--text-3)"; }
				else { markSteerFailed(tag, ta, text, (r.data && r.data.error) || "未送达"); }
			})
			.catch(function () { markSteerFailed(tag, ta, text, "网络异常，未送达"); });
	}
	function markSteerFailed(tag, ta, text, reason) {
		tag.textContent = "⚠ " + reason + "（点击重试）";
		tag.style.color = "var(--err)"; tag.style.cursor = "pointer";
		toast("追问未送达：" + reason);
		tag.addEventListener("click", function () {
			ta.value = text; ta.focus();
			var m = tag.closest(".msg"); if (m) m.remove();
		});
	}

	/* ---------- 绑定 ---------- */

	// ＋ 添加菜单：文件 / 技能 / 智能体。技能与智能体均接真实后端（列表 + 上传）。
