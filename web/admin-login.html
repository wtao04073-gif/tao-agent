<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号登录 · Tao Agent</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/web.css"></head>
<body><div class="auth-wrap"><main class="auth-card"><div class="auth-logo" data-brand-logo>Tao</div><p data-brand-name>Tao Agent</p><h2 id="title">账号登录</h2><p id="info">使用管理员分配的账号密码登录。</p><form id="login"><div class="field"><label for="user">登录名</label><input id="user" required autocomplete="username"></div><div class="field"><label for="password">密码</label><input id="password" type="password" minlength="12" required autocomplete="current-password"></div><div class="field" id="claimLabel" hidden><label for="claim">首次初始化凭据</label><input id="claim" type="password" autocomplete="off"></div><button class="btn btn--primary btn--block" type="submit">登录 / 完成初始化</button></form><p id="error" role="alert"></p><a href="/login.html">使用原访问令牌登录</a></main></div><script src="/assets/admin-login.js"></script><script src="/assets/branding.js" defer></script></body></html>
