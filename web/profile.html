<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人设置</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/web.css"><script src="/assets/core.js" defer></script><script src="/assets/profile.js" defer></script><script src="/assets/branding.js" defer></script></head><body><div class="auth-wrap"><main class="auth-card"><h1>个人设置</h1><p id="profileIdentity"></p><form id="profileForm"><div class="field"><label for="displayName">显示名</label><input id="displayName" maxlength="128" required></div><div class="field"><label for="currentPassword">原密码（修改密码时填写）</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label for="newPassword">新密码（至少12字符，留空不修改）</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12"></div><div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button class="btn btn--primary" type="submit">保存</button></form><p id="profileStatus" role="status"></p><a href="/chat.html">返回工作区</a></main></div></body></html>
